[project]
name = "rlsbl"
version = "0.132.0"
description = "Release orchestration and project scaffolding CLI that bumps versions, validates a structured JSONL changelog, tags only the commit CI verified, and publishes to npm, PyPI, Go and more"
readme = "README.md"
license = "MIT"
keywords = ["release", "release-automation", "changelog", "versioning", "monorepo", "npm", "pypi", "go", "scaffold", "rlsbl"]
classifiers = [
    "Environment :: Console",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Intended Audience :: Developers",
]

[project.urls]
Homepage = "https://smmh.dev/rlsbl/"
Documentation = "https://smmh.dev/rlsbl/"
Repository = "https://github.com/stricttools/rlsbl"
Issues = "https://github.com/stricttools/rlsbl/issues"
Changelog = "https://github.com/stricttools/rlsbl/blob/main/CHANGELOG.md"
