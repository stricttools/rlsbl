[project]
name = "rlsbl"
version = "0.70.0"
description = "Release orchestration and project scaffolding across package ecosystems"
license = "MIT"
authors = [{ name = "smm-h" }]
readme = "README.md"
requires-python = ">=3.11"
keywords = ["release", "npm", "pypi", "go", "goreleaser", "publish", "cli", "scaffold", "rlsbl"]
dependencies = [
    "ruamel-yaml",
    "strictcli",
    "tomlkit>=0.12",
    "tree-sitter>=0.24",
    "tree-sitter-go>=0.23",
    "tree-sitter-javascript>=0.23",
    "tree-sitter-python>=0.23",
    "tree-sitter-typescript>=0.23",
]

[project.urls]
Repository = "https://github.com/smm-h/rlsbl"

[project.scripts]
rlsbl = "rlsbl:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-xdist>=3.5",
]

[tool.uv.sources]
strictcli = { path = "/home/m/Projects/strictcli/python", editable = true }
