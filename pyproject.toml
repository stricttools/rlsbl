[project]
name = "rlsbl"
version = "0.116.0"
description = "Release orchestration and project scaffolding across package ecosystems"
license = "MIT"
authors = [{ name = "smm-h" }]
readme = "README.md"
requires-python = ">=3.11"
keywords = ["release", "npm", "pypi", "go", "goreleaser", "publish", "cli", "scaffold", "rlsbl"]
dependencies = [
    "ruamel-yaml>=0.19.1",
    "strictcli>=0.41.0",
    "strictspec>=0.1.0",
    "tomlkit>=0.12",
    "tree-sitter>=0.24",
    "tree-sitter-go>=0.23",
    "tree-sitter-javascript>=0.23",
    "tree-sitter-python>=0.23",
    "tree-sitter-typescript>=0.23",
]

[project.optional-dependencies]
docs = ["selfdoc-core>=0.1.1; python_version >= '3.12'"]

[project.urls]
Repository = "https://github.com/smm-h/rlsbl"

[project.scripts]
rlsbl = "rlsbl:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=5.0",
    "pytest-xdist>=3.5",
    "ruff>=0.15.20",
    # rlsbl distributes the stricttest floor's outer layer (the bwrap runner and
    # the stricttest-floor check), so it runs the published plugin rather than a
    # private copy of it. Floor at the version that first shipped every ini key
    # used below (the five safety keys plus threshold / tmp_prefix / git
    # identity / preserve).
    "stricttest>=0.1.1",
]

# The stricttest floor's configuration. Installing the plugin IS adoption: the
# five safety keys are required and a missing one aborts the session.
#
# Stances, and why:
#   sockets = deny        the suite reaches no network. Every outward call
#                         (urlopen, socket.create_connection, gh, the registry
#                         probes) is mocked; the sandbox has no network at all.
#   *_allowlist = []      nothing is exempt from the above.
#   loopback = deny       no test binds or dials a local port.
#   sandbox_required      rlsbl HAS the runner (scripts/test.sh, emitted from
#                         the test_sandbox config family), so the bare-run
#                         threshold is enforced.
#   threshold = 50        a targeted run (one file, a -k slice) stays bare-
#                         runnable for iteration speed; anything bigger must go
#                         through the sandbox.
#   tmp_prefix            names rlsbl's throwaway env dirs recognizably.
#   git identity          the session commit identity real-git fixtures inherit
#                         when they configure none of their own.
#   preserve              toolchain caches that must survive the HOME repoint:
#                         the Go caches (the safegit_bin fixture go-installs the
#                         pinned binary) and PYTHONUSERBASE (the extract/absorb
#                         tests shell out to a system-python git-filter-repo).
[tool.pytest.ini_options]
stricttest_sockets = "deny"
stricttest_socket_allowlist = []
stricttest_unix_socket_allowlist = []
stricttest_loopback = "deny"
stricttest_sandbox_required = "true"
stricttest_threshold = "50"
stricttest_tmp_prefix = "rlsbl-test-env-"
stricttest_git_user_name = "rlsbl-test"
stricttest_git_user_email = "rlsbl-test@example.invalid"
stricttest_preserve = ["go_path", "go_mod_cache", "go_cache", "python_user_base"]

[tool.coverage.run]
source = ["rlsbl"]

[tool.ruff]
target-version = "py311"
src = ["rlsbl"]
include = ["rlsbl/**/*.py"]

[tool.ruff.lint]
select = ["F401", "F841"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
