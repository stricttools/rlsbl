# Centralized GitHub Actions versions used by rlsbl-generated workflows.
# Update this file to bump action versions across all scaffolded projects.

"actions/checkout" = "v6"
"actions/setup-node" = "v6"
"actions/setup-go" = "v6"
"actions/setup-java" = "v5"
"actions/setup-python" = "v5"
"astral-sh/setup-uv" = "v7"
"pypa/gh-action-pypi-publish" = "release/v1"
"goreleaser/goreleaser-action" = "v7.2.3"
# Not an action: the goreleaser DISTRIBUTION the action installs, pinned
# exactly and consumed through {{actionVersion "..."}} as the action's
# `version:` input. A floating "~> v2" resolved to 2.18.1, which reads the
# tag contents of GORELEASER_CURRENT_TAG before --skip=validate applies and
# aborts when no tag carries that name -- a release that published its
# module and packages with zero archives on its GitHub Release.
"goreleaser/goreleaser" = "v2.18.1"
"dtolnay/rust-toolchain" = "stable"
"dart-lang/setup-dart" = "v1"
"denoland/setup-deno" = "v2"
"docker/setup-buildx-action" = "v3"
"docker/build-push-action" = "v6"
"docker/login-action" = "v3"
"docker/metadata-action" = "v5"
"erlef/setup-beam" = "v1"
"gradle/actions/setup-gradle" = "v6"
"pnpm/action-setup" = "v4"
"subosito/flutter-action" = "v2"
"swift-actions/setup-swift" = "v2"
"mlugg/setup-zig" = "v1"
"dorny/paths-filter" = "v4"
