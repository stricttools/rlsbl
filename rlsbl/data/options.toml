# rlsbl's options registry: every rlsbl check is an option, rlsbl:<check name>,
# validated by strictspec's built-in options-registry schema. Generated from
# rlsbl/data/checks.toml by `scripts/gen_options_registry.py`; never edit it by
# hand.

format_version = 2

[[option]]
name = "branch-sync"
subject = "release"
values = "error > warn > off"
default = "error"
scope = "none"
requires = []
description = "The local branch is not behind its remote tracking branch (requires network)."

[[option]]
name = "changelog-batch-commits"
subject = "changelog"
values = "error > warn > off"
default = "error"
scope = "none"
requires = []
description = "No changelog entry references more commits than max_commits_per_entry."

[[option]]
name = "changelog-batch-entries"
subject = "changelog"
values = "error > warn > off"
default = "error"
scope = "none"
requires = []
description = "No commit appears in more changelog entries than max_entries_per_commit."

[[option]]
name = "changelog-coverage"
subject = "changelog"
values = "error > warn > off"
default = "error"
scope = "none"
requires = ["changelog-hashes"]
description = "Every unreleased commit appears in at least one JSONL changelog entry."

[[option]]
name = "changelog-entry"
subject = "changelog"
values = "error > warn > off"
default = "error"
scope = "none"
requires = ["version-consistency"]
description = "CHANGELOG.md has an entry for the current project version."

[[option]]
name = "changelog-format-version-gate"
subject = "changelog"
values = "error > warn > off"
default = "error"
scope = "none"
requires = []
description = "Every line of unreleased.jsonl and of every finalized x.y.z.jsonl carries a supported format_version."

[[option]]
name = "changelog-hashes"
subject = "changelog"
values = "error > warn > off"
default = "error"
scope = "none"
requires = []
description = "Every commit hash in the JSONL changelog entries resolves in git."

[[option]]
name = "changelog-orphans"
subject = "changelog"
values = "error > warn > off"
default = "error"
scope = "none"
requires = []
description = "No changelog entry has every hash unresolvable, out of range, or owned by another releasable."

[[option]]
name = "changelog-range"
subject = "changelog"
values = "error > warn > off"
default = "error"
scope = "none"
requires = ["changelog-hashes"]
description = "Every resolved changelog hash falls within this checkout's unreleased commit range."

[[option]]
name = "changelog-schema"
subject = "changelog"
values = "error > warn > off"
default = "error"
scope = "none"
requires = []
description = "Every changelog entry passes schema validation: a user-facing entry carries a description and a type."

[[option]]
name = "changelog-user-facing"
subject = "changelog"
values = "warn > off"
default = "warn"
scope = "none"
requires = []
description = "At least one unreleased changelog entry is user-facing."

[[option]]
name = "ci-publish-secrets"
subject = "release"
values = "error > warn > off"
default = "error"
scope = "none"
requires = []
description = "Every Actions secret the configured CI publish pipelines authenticate with exists on the repository (requires network)."

[[option]]
name = "circular-deps"
subject = "code"
values = "warn > off"
default = "warn"
scope = "none"
requires = []
description = "No circular import dependency exists between a package's modules."

[[option]]
name = "cli-test-coverage"
subject = "tests"
values = "error > warn > off"
default = "error"
scope = "none"
requires = []
description = "Every registered command path appears in the committed test-coverage manifest."

[[option]]
name = "config-schema"
subject = "project"
values = "error > warn > off"
default = "error"
scope = "none"
requires = []
description = ".rlsbl/config.json passes rlsbl's config validation: required, banned, and retired keys, section shapes, and settings whose option is off."

[[option]]
name = "consequential-grant-agreement"
subject = "code"
values = "warn > off"
default = "warn"
scope = "none"
requires = []
description = "Every command declaring a grant that leaves the process also declares itself consequential."

[[option]]
name = "cross-repo-path-sources"
