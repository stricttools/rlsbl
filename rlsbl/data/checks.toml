# The three probing release checks. Each reads something outside the working
# tree and each is fail-closed: an unanswered probe is an error, never a pass.
# They carry "release" rather than "project" so the offline tags stay offline.
# Deliberately NOT in "preflight": the release pipeline's own steps already
# authenticate against GitHub and the registries, and a probe failure at
# preflight time would block a release for a network condition rather than for
# anything about the repository.

# ci-publish-secrets: every repository secret the configured CI publish
# pipelines authenticate with must exist on the repository; without it the
# publish job dies with ENEEDAUTH after the release has already tagged, pushed
# and created the GitHub Release. WHICH secrets those are is each pipeline's own
# declaration (ci_secret_names), never a pipeline type tested by name -- npm
# declares NPM_TOKEN, maven-central declares its Central Portal credentials and
# GPG signing key, hex declares HEX_API_KEY, and a pypi pipeline declares none
# because it authenticates through OIDC trusted publishing. Presence only -- a
# secret's value is not
# retrievable through the API, and rlsbl never puts a credential on a pipe.
[checks.ci-publish-secrets]
tags = ["release"]
severity = "error"
fast = true
pure = false
needs_network = true
depends_on = []

# old-repo-archived: an absorb leaves its source repository standing, where it
