# re-constrained after the lock was written is visible without resolving
# anything; go.sum is compared for coverage of go.mod's require lines. Pure and
# offline by construction: no package manager is invoked (see rlsbl/dep_locks.py
# for why `uv lock --check` was rejected). In "preflight" so a stale lock blocks
# the release whose bump would otherwise silently rewrite it.
# strictspec-generated-floor: a generated validator calls
# require_runtime_version(GENERATED_BY) at IMPORT, and that pairing is exact, so
# a declared strictspec floor below any committed GENERATED_BY ships an artifact
