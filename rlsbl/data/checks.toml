app = "rlsbl"

# Purity standard for the `pure` flag below.
#
# pure   = the check starts ONLY allowlisted read-only programs. The allowlist
#          is rlsbl/observe_allowlist.py, and its written standard is "no
#          user-visible mutation": ref updates, index writes and credential
#          emission are refused there, so anything that reaches the list
#          changes nothing a user would notice. A check that spawns no program
#          at all is trivially pure.
# impure  = the check starts a program that is NOT on that list. Every impure
#          check today runs a tool that writes -- ruff rewrites files, `uv
#          sync` materializes an environment, the test suites build.
#          "Sometimes shells out to a writing tool" means impure.
#
# This replaced "the check spawns no subprocess at all". That older rule forced
# nine checks that spawn only read-only local git to be declared impure, and it
# quietly misdeclared two that DO spawn: the retired `local-tag` ran
# `git tag --list`, and `config-schema` can reach `go list` on its error path.
# Under the rule above both are legitimately pure, and `config-schema` is
# declared so deliberately rather than by accident. The full record is in
# rlsbl/observe_allowlist.py.
#
# Verifiable rather than asserted: tests/test_check_purity.py executes every
# pure-declared check under an effects observer and fails on any spawn whose
# argv matches no allowlist prefix.
#
# `needs_network` is orthogonal and unchanged: it says whether the check needs
# the network to answer at all, never whether it may mutate.

# Hooks: each names the check selection a git hook or the release runs, so the
# installed pre-push hook runs `rlsbl failing-checks --hook pre-push` and never
# spells a tag expression of its own. The release's check step runs the
# pre-release hook's selection (rlsbl.checks.hook_selection).

[hooks.pre-push]
tag = "prepush"

[hooks.pre-release]
tag = "preflight"

