# against the lock and cannot see this. Pure (reads strictspec.toml, the
# generated files and pyproject.toml). In "preflight" because this class broke a
# release attempt.
[checks.strictspec-generated-floor]
tags = ["project", "preflight"]
severity = "error"
fast = true
pure = true
needs_network = false
depends_on = []

