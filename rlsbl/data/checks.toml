# Ecosystem-internal dependency floors: a release that requires new framework
# behavior must declare a ">=" floor at that version, or a consumer installing
# the published artifact resolves an older framework and breaks. Compares the
# declared constraint (pyproject.toml / package.json) against the locked
# version (uv.lock / package-lock.json); Go is structurally satisfied (require
# lines ARE the minimums). Feature-flagged by adoption -- skips visibly when
# the repo has no "internal_dep_floors" config key. Pure (reads committed
# TOML/JSON, no subprocess or network). In "preflight" so a lagging floor
# blocks the release that would ship it.
[checks.dep-floors]
description = "Every ecosystem-internal dependency declares a >= floor at the version the lockfile resolves."
subject = "dependencies"
tags = ["project", "preflight"]
severity = "error"
fast = true
pure = true
needs_network = false
depends_on = ["config-schema"]

# dep-locks: the question underneath dep-floors -- does each lockfile still
# resolve the manifest beside it? uv.lock and package-lock.json both record the
# requirements they resolved FROM, so a dependency added, removed or
# re-constrained after the lock was written is visible without resolving
# anything; go.sum is compared for coverage of go.mod's require lines. Pure and
# offline by construction: no package manager is invoked (see rlsbl/dep_locks.py
# for why `uv lock --check` was rejected). In "preflight" so a stale lock blocks
# the release whose bump would otherwise silently rewrite it.
# strictspec-generated-format: a generated validator declares the shape it was
# written to as GENERATED_CODE_FORMAT and calls
# require_generated_code_format(GENERATED_CODE_FORMAT, GENERATED_BY) at IMPORT.
# Pairing holds while that format is inside the inclusive range the linked
# runtime declares, so an ordinary strictspec release stales nothing -- but a
# validator outside the range, or one predating the declaration, raises on
# import for whoever installed the artifact. The remedy is regeneration; no
# dependency floor is derived from GENERATED_BY. Pure (reads strictspec.toml,
# the generated files and the linked runtime's declared range). In "preflight"
# because this class broke a release attempt.
[checks.strictspec-generated-format]
description = "Every validator strictspec.toml declares carries a GENERATED_CODE_FORMAT the linked strictspec runtime reads."
subject = "code"
tags = ["project", "preflight"]
severity = "error"
fast = true
pure = true
needs_network = false
depends_on = []

# go-module-identity: a go.mod module path IS the URL the toolchain fetches
# from, so a renamed repo, a new owner or an absorb that moved the module under
# a subdirectory leaves a module nobody can `go get`. Compared against the
# origin remote's own identity; a repo with no origin skips rather than guessing
# one. Pure (reads go.mod plus read-only local git). In "preflight" so a module
# path the repository no longer serves cannot be published.
[checks.go-module-identity]
description = "Every go.mod's module path equals the repository's origin identity plus the module's subdirectory."
subject = "project"
tags = ["project", "preflight"]
severity = "error"
fast = true
pure = true
needs_network = false
depends_on = []

# path-tag-format-go-member: a releasable whose tag_format is a Go path tag
# (`<path>/v{version}`) publishes the module at that path, permanently, so the
# path must be one of the releasable's own Go members. Pure (reads the
