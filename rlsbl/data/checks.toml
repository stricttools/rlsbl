# The three probing release checks. Each reads something outside the working
# tree and each is fail-closed: an unanswered probe is an error, never a pass.
# They carry "release" rather than "project" so the offline tags stay offline.
# Deliberately NOT in "preflight": the release pipeline's own steps already
# authenticate against GitHub and the registries, and a probe failure at
# preflight time would block a release for a network condition rather than for
# anything about the repository.

# ci-publish-secrets: every repository secret the configured CI publish
# pipelines authenticate with must exist on the repository; without it the
# publish job dies with ENEEDAUTH after the release has already tagged, pushed
# and created the GitHub Release. WHICH secrets those are is each pipeline's own
# declaration (ci_secret_names), never a pipeline type tested by name -- npm
# declares NPM_TOKEN, and a pypi pipeline declares none because it
# authenticates through OIDC trusted publishing. Presence only -- a secret's
# value is not retrievable through the API, and rlsbl never puts a credential
# on a pipe.
[checks.ci-publish-secrets]
description = "Every Actions secret the configured CI publish pipelines authenticate with exists on the repository (requires network)."
subject = "release"
tags = ["release"]
severity = "error"
fast = true
pure = false
needs_network = true
depends_on = []

# npm-token-synced: the npm token in ~/.npmrc is accepted by npm, and the
# repository's NPM_TOKEN secret was set no earlier than that token was created.
# A secret set before it holds an older token, and once that one expires the
# CI npm publish fails after the release has tagged and pushed. The one
# networked check in "preflight", by decision: a replaced token goes stale in
# every repository at once, and only a check that blocks the release before
# anything is tagged catches the next release of each of them. Fail-closed like
# the rest: an unanswered probe or an undeterminable time is an error, and the
# finding names `rlsbl secrets sync-npm-token` as the fix. Impure because it
# runs `npm token list --json`, which the observe allowlist does not admit.
[checks.npm-token-synced]
description = "The npm token in ~/.npmrc is accepted by npm, and the repository's NPM_TOKEN secret was set no earlier than that token was created (requires network)."
subject = "release"
tags = ["release", "preflight"]
severity = "error"
fast = true
pure = false
needs_network = true
depends_on = []

# private-repo-publishing: npm build provenance, PyPI attestations, and the Go
# module proxy need a public source repository; on a private one they fail after
# the tag is public or record the private repository in a public log. The
# release refuses the same findings before it pushes anything. Visibility is
# asked only when one of them is in use.
[checks.private-repo-publishing]
description = "A private repository's release uses nothing that needs a public repository: npm build provenance, PyPI attestations, or the Go module proxy (requires network)."
subject = "release"
tags = ["release"]
severity = "error"
fast = true
pure = false
needs_network = true
depends_on = []

# old-repo-archived: an absorb leaves its source repository standing, where it
# keeps collecting issues, pull requests and clones for code that moved here.
# Skips when the transition record holds no absorb. rlsbl never archives it: the
# finding prints the `gh repo archive` command.
[checks.old-repo-archived]
description = "Every repository this one absorbed is archived on GitHub (requires network)."
subject = "release"
tags = ["release"]
severity = "error"
fast = false
pure = false
needs_network = true
depends_on = []

# go-deprecation-published: a recorded go-module-path transition leaves the OLD
# path published, and a consumer resolving it sees nothing about the move until
# the old repository serves a `// Deprecated:` notice. Probes the module proxy
# for the old path's latest go.mod. Skips when the record holds no such
# transition; rlsbl never commits into the retired repository.
[checks.go-deprecation-published]
description = "Every superseded Go module path serves a Deprecated notice through the Go module proxy (requires network)."
subject = "release"
tags = ["release"]
severity = "error"
fast = false
pure = false
needs_network = true
depends_on = []

