[[capability.effect]]
name      = "ref create"
class     = "program"
purpose   = "Create a release or kept tag only where no ref of that name exists yet."
program   = "path:git"
args      = ["update-ref", "{ref}", "{object}", "{absent}"]
params    = { ref = "string", object = "string", absent = "string" }
dir       = "repo:cwd"
env       = [
  { name = "PATH", from = "env:PATH" },
  { name = "HOME", from = "env:HOME" },
]
stdin     = "none"
output    = "passed"
unbounded = true
deadline  = "2m"
answer    = "exit"

[[capability.effect]]
name      = "ref delete"
class     = "program"
purpose   = "Delete a tag only while it still points where the plan observed it."
program   = "path:git"
args      = ["update-ref", "-d", "{ref}", "{expected}"]
params    = { ref = "string", expected = "string" }
dir       = "repo:cwd"
env       = [
  { name = "PATH", from = "env:PATH" },
  { name = "HOME", from = "env:HOME" },
]
stdin     = "none"
output    = "passed"
unbounded = true
deadline  = "2m"
answer    = "exit"

