format = 1

[[capability]]
name     = "working-tree-reading"
purpose  = "Judge and plan from the declarations, records, manifests, workflows, and sources the repository holds."
commands = [
  "check", "failing-checks list", "commit", "scaffold", "status show", "targets list",
  "unreleased-commits list", "watch", "changelog add", "changelog amend", "changelog edit",
  "changelog generate", "changelog remap", "changelog remove", "confidential hit approve",
  "confidential hit dismiss", "dev install", "dev status show", "dev sync", "records migrate",
  "monorepo absorb", "monorepo add", "monorepo names check", "monorepo residue remove", "monorepo extract",
  "monorepo graph render", "monorepo impact show", "monorepo init", "monorepo list",
  "monorepo dependencies list", "monorepo remove", "monorepo releasable rename", "monorepo status show",
  "monorepo sync", "monorepo release init", "monorepo release order show", "monorepo release run",
  "options set", "release abandon", "release backfill", "release deprecate", "release edit", "release init",
  "release reconcile", "release resume", "release retract", "release retry", "release run", "release scrub",
  "release undo", "release yank", "go-module-path rewrite", "project-name rewrite", "uv-path-sources rewrite",
  "transition classify", "transition declassify", "transition identity add", "transition minimal-record init",
  "transition license change", "transition lifecycle change", "transition show",
  "transition unversioned-tag add", "upstream tags adopt",
]

[[capability.resource]]
name    = "working-tree"
class   = "directory"
purpose = "Load releasables.toml, the changelogs, release archives, options, lifecycle record, manifests, and workflows of the repository holding the working directory."
scope   = "repo:cwd"
match   = "subtree"
modes   = ["read", "list", "stat"]

[[capability]]
name     = "record-writing"
purpose  = "Keep the declarations, changelogs, release archives, options, and lifecycle record that every later command and release reads."
commands = [
  "scaffold", "changelog add", "changelog amend", "changelog edit", "changelog generate", "changelog remap",
  "changelog remove", "confidential hit approve", "confidential hit dismiss", "records migrate",
  "monorepo absorb", "monorepo add", "monorepo extract", "monorepo init", "monorepo remove",
  "monorepo releasable rename", "monorepo sync", "monorepo release init", "monorepo release run", "options set",
  "release abandon", "release backfill", "release deprecate", "release init", "release reconcile",
  "release resume", "release retract", "release run", "release scrub", "release undo", "release yank",
  "project-name rewrite", "uv-path-sources rewrite", "transition classify", "transition declassify",
  "transition identity add", "transition minimal-record init", "transition license change",
  "transition lifecycle change", "transition unversioned-tag add",
]

[[capability.resource]]
name    = "metadata-tree"
class   = "directory"
purpose = "Write each record through a temporary file renamed over it, and keep released files read-only."
scope   = "repo:cwd/.strictmetadata"
match   = "subtree"
modes   = ["read", "list", "stat", "create", "replace", "overwrite", "delete", "rename", "mkdir", "chmod"]

[[capability]]
name     = "project-writing"
purpose  = "Bring the project's manifests, generated changelog, workflows, Go sources, and scaffolded files in line with its records."
commands = [
  "scaffold", "changelog amend", "changelog edit", "changelog generate", "changelog remap", "changelog remove",
  "dev sync", "records migrate", "monorepo absorb", "monorepo add", "monorepo extract",
  "monorepo releasable rename", "monorepo sync", "monorepo release run", "release resume", "release retract",
  "release run", "release scrub", "release undo", "release yank", "go-module-path rewrite",
  "project-name rewrite", "uv-path-sources rewrite", "transition declassify",
]

[[capability.resource]]
name    = "project-tree"
class   = "directory"
purpose = "Write version files, CHANGELOG.md, CI workflows, go.mod directives, renamed imports, and hook scripts where the project keeps them."
scope   = "repo:cwd"
match   = "subtree"
modes   = ["create", "replace", "overwrite", "delete", "rename", "mkdir", "chmod"]

[[capability]]
name     = "run-state"
purpose  = "Let one command at a time change release state, and let a stopped release or rewrite resume where it stopped."
commands = [
  "scaffold", "changelog add", "changelog amend", "changelog edit", "changelog generate", "changelog remap",
  "changelog remove", "monorepo absorb", "monorepo add", "monorepo residue remove", "monorepo extract",
  "monorepo releasable rename", "monorepo release run", "release abandon", "release backfill",
  "release deprecate", "release reconcile", "release resume", "release retract", "release retry", "release run",
  "release scrub", "release undo", "release yank", "transition declassify",
]

[[capability.resource]]
name    = "release-state"
class   = "directory"
purpose = "Keep the in-progress, plan, retry, and scrub result files a resumed run continues from."
scope   = "repo:cwd/.strictmetadata/.release-state"
match   = "subtree"
modes   = ["read", "list", "stat", "create", "replace", "delete", "rename", "mkdir"]

[[capability.effect]]
name    = "writer hold"
class   = "lock"
purpose = "Wait for any other rlsbl run changing release state to finish before this one starts changing it."
path    = "repo:cwd/.strictmetadata/.release-state/lock"
wait    = "24h"

[[capability.effect]]
name    = "writer claim"
class   = "lock"
purpose = "Refuse to start while another rlsbl run changes release state, instead of waiting for it."
path    = "repo:cwd/.strictmetadata/.release-state/lock"
wait    = "1s"

[[capability]]
name     = "git-reading"
purpose  = "Answer the history, ref, and working-tree questions every release decision rests on, without changing the repository."
commands = [
  "check", "failing-checks list", "commit", "scaffold", "status show", "unreleased-commits list", "watch",
  "changelog add", "changelog amend", "changelog edit", "changelog generate", "changelog remap",
  "changelog remove", "confidential hit approve", "confidential hit dismiss", "records migrate",
  "monorepo absorb", "monorepo add", "monorepo residue remove", "monorepo extract", "monorepo impact show",
  "monorepo init", "monorepo releasable rename", "monorepo status show", "monorepo sync",
  "monorepo release init", "monorepo release run", "options set", "release abandon", "release backfill",
  "release deprecate", "release edit", "release init", "release reconcile", "release resume", "release retract",
  "release retry", "release run", "release scrub", "release undo", "release yank", "go-module-path rewrite",
  "project-name rewrite", "secrets npm-token sync", "transition classify", "transition declassify",
  "transition identity add", "transition minimal-record init", "transition license change",
  "transition lifecycle change", "transition show", "transition unversioned-tag add", "upstream tags adopt",
