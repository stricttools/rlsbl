[[command]]
path          = "name check"
help          = "Ask npm and PyPI whether package names and every name colliding with them are registered, and judge Go package names offline."
consequential = false
outstanding   = 1
render        = true

[[command.flag]]
name    = "target"
type    = "string"
help    = "A registry or rule set to check each name against, repeatable."
list    = true
choices = [
  { value = "npm", help = "the npm registry." },
  { value = "pypi", help = "the Python Package Index." },
  { value = "go", help = "the Go package name the candidate implies, judged offline against Go's rules and the standard library's package names." },
]
unique  = true
min     = 1

[[command.flag]]
name = "delay"
type = "integer"
help = "Milliseconds to wait between consecutive registry requests; the offline Go check never waits."
at-least = 0

[[command.arg]]
name = "names"
type = "string"
help = "Package names to check."
list = true
min  = 1

[[command.output]]
name = "delay-ms"
type = "integer"
help = "The wait between registry requests, in milliseconds."
wire = "delay_ms"

[[command.output]]
name = "results"
type = "name-verdict"
help = "One verdict per name and target, in the order given."
list = true

[[command.carry]]
name = "step"

[[command.carry.field]]
name = "step"
type = "string"
help = "Which step of the command the answer belongs to, so the completion handler resumes the right one."

[[command.carry.field]]
name = "subject"
type = "string"
help = "The ref, tag, file, member, or version the step acts on, so the completion handler knows which one answered."

[[command.exit]]
code    = 1
name    = "unavailable"
meaning = "A name is taken, invalid, or discouraged."

[[command.exit]]
code    = 2
name    = "unanswered"
meaning = "A registry could not answer about a name or a similar one, so its availability is unknown."

