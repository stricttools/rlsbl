[[command]]
path          = "status show"
help          = "Report the member at the working directory: its package and version, branch and cleanliness, lifecycle, latest release, and changelog coverage."
consequential = false
outstanding   = 1
render        = true

[[command.flag]]
name     = "target"
type     = "string"
help     = "The member's target to report on; absent means the member's only target, and a member with several is refused."
optional = true
choices  = [
  { value = "go", help = "a Go module." },
  { value = "npm", help = "an npm package." },
  { value = "pypi", help = "a Python package." },
]

[[command.flag]]
name = "registry"
type = "boolean"
help = "Compare the local version with the latest one the registry's package listing holds, or ask no registry."

[[command.output]]
name = "member"
type = "string"
help = "The member reported on."

[[command.output]]
name = "target"
type = "string"
help = "The target reported on."

[[command.output]]
name = "name"
type = "string"
help = "The package name the target's manifest declares."

[[command.output]]
name = "version"
type = "string"
help = "The version the target's manifest declares."

[[command.output]]
name = "version-files"
type = "string"
help = "The files the target's version lives in."
list = true
wire = "version_files"

[[command.output]]
name = "workspace"
type = "boolean"
help = "Whether the repository is a workspace."

[[command.output]]
name     = "releasable"
type     = "string"
help     = "The releasable the member is versioned under; null for none."
optional = true

[[command.output]]
name     = "releasable-version"
type     = "string"
help     = "The releasable's version file's version; null when it has none."
optional = true
wire     = "releasable_version"

[[command.output]]
name = "publish"
type = "boolean"
help = "Whether the releasable publishes to a registry."

[[command.output]]
name     = "branch"
type     = "string"
help     = "The current branch; null when HEAD is detached."
optional = true

[[command.output]]
name = "clean"
type = "boolean"
help = "Whether the working tree has no uncommitted changes."

[[command.output]]
name     = "lifecycle"
type     = "string"
help     = "The releasable's lifecycle status today; null without a releasable."
optional = true
choices  = ["active", "non-releasing", "retired", "unreleased"]

[[command.output]]
name     = "latest-release"
type     = "string"
help     = "The latest release the archives record; null when none."
optional = true
wire     = "latest_release"

[[command.output]]
name = "latest-release-label"
type = "string"
help = "The latest release as the report prints it, annotated."
wire = "latest_release_label"

[[command.output]]
name     = "latest-release-in-checkout"
type     = "boolean"
help     = "Whether this checkout contains the latest release; null when there is none."
optional = true
wire     = "latest_release_in_checkout"

[[command.output]]
name     = "latest-release-state"
type     = "string"
help     = "Whether the latest release's commit is recorded or unrecoverable; null when there is none."
optional = true
wire     = "latest_release_state"
choices  = ["recorded", "unrecoverable"]

[[command.output]]
name = "never-released-versions"
type = "string"
help = "Versions archived above the latest release that were never released or are retracted."
list = true
wire = "never_released_versions"

[[command.output]]
name     = "nearest-release-tag"
type     = "string"
help     = "The tag of the nearest release this checkout contains; null when none."
optional = true
wire     = "nearest_release_tag"

[[command.output]]
name     = "changelog-has-version"
type     = "boolean"
help     = "Whether the changelog holds the released file of the current version; null without a releasable."
optional = true
wire     = "changelog_has_version"

[[command.output]]
name     = "coverage"
type     = "coverage-count"
help     = "Changelog coverage since the nearest release; null without a releasable."
optional = true

[[command.output]]
name     = "commits-ahead"
type     = "integer"
help     = "Commits needing an entry since the nearest release; null without a releasable."
optional = true
wire     = "commits_ahead"

[[command.output]]
name = "ci"
type = "string"
help = "The member's own CI workflows and its publish workflow."
list = true

[[command.output]]
name     = "registry-version"
type     = "string"
help     = "The latest version the registry lists; null without --registry."
optional = true
wire     = "registry_version"

[[command.output]]
name     = "drift"
type     = "string"
help     = "How the local version compares with the registry's; null without --registry."
optional = true
choices  = ["AHEAD", "BEHIND", "SAME", "UNPUBLISHED", "PUBLISHES_NOTHING"]

[[command.carry]]
name = "step"

[[command.carry.field]]
name = "step"
type = "string"
help = "Which step of the command the answer belongs to, so the completion handler resumes the right one."

[[command.carry.field]]
name = "subject"
type = "string"
help = "The ref, tag, file, member, or version the step acts on, so the completion handler knows which one answered."

[[command.exit]]
code    = 1
name    = "failed"
meaning = "The command refused its input or the repository's state, or a read, program, or request it needed failed, and said why."

