type = "string"
help = "The option, as rlsbl:<name>."

[[command.output]]
name = "id"
type = "string"
help = "The option written."

[[command.output]]
name = "class"
type = "string"
help = "The option's class in the registry."

[[command.output]]
name = "file"
type = "string"
help = "The options file written, relative to the repository root."

[[command.output]]
name     = "scope"
type     = "string"
help     = "The scope of the entry; null for the whole repository."
optional = true

[[command.output]]
name = "current"
type = "string"
help = "The current value written."

[[command.output]]
name = "ideal"
type = "string"
help = "The ideal value written."

[[command.output]]
name = "reason"
type = "string"
help = "The reason written."

[[command.output]]
