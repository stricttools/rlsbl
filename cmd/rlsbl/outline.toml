format = 1
help   = "Release orchestration and project scaffolding: bump versions, keep a structured changelog, tag only the commit CI verified, publish to npm, PyPI, and the Go module proxy, and scaffold CI workflows."
checks = "checks.toml"

[[field-set]]
name = "commit-choice"

[[field-set.field]]
name = "auto-commit"
type = "boolean"
help = "Commit what the command wrote, or with --no-auto-commit leave it uncommitted."

[[field-set]]
name = "check-selection"

[[field-set.field]]
name = "all"
type = "boolean"
help = "Run every registered check whatever the other selectors say, or only the checks they select."

[[field-set.field]]
name     = "tag"
type     = "string"
help     = "Tag expression selecting checks, such as changelog & !quality; absent means no tag expression selects checks."
optional = true

[[field-set.field]]
name     = "name"
type     = "string"
help     = "Glob pattern over check names, such as *coverage*; absent means no name pattern selects checks."
optional = true

[[field-set.field]]
name     = "hook"
type     = "string"
help     = "The hook whose declared selection runs, pre-push for the prepush tag or pre-release for the preflight tag; absent means no hook selects checks."
optional = true
choices  = [
  { value = "pre-push", help = "the checks tagged prepush, which the pre-push hook runs." },
  { value = "pre-release", help = "the checks tagged preflight, which a release runs." },
]

[[field-set.field]]
name = "list"
type = "boolean"
help = "List the registered checks with their tags and values and run none, or run the selected checks."

[[field-set]]
name = "release-timeouts"

[[field-set.field]]
name     = "push-timeout"
type     = "integer"
help     = "Seconds each push may take; absent means the push_seconds of releasables.toml's [timeouts], which must then state it."
optional = true
at-least = 1

[[field-set.field]]
name     = "ci-timeout"
type     = "integer"
help     = "Seconds the wait for CI's verdict on the candidate may take; absent means the ci_seconds of releasables.toml's [timeouts], which must then state it."
optional = true
at-least = 1

[[field-set.field]]
name     = "check-timeout"
type     = "integer"
help     = "Seconds each program a check, the help document, selfdoc, or the deploy starts may take; absent means the check_seconds of releasables.toml's [timeouts], which must then state it."
optional = true
at-least = 1

[[field-set.field]]
name     = "hook-timeout"
type     = "integer"
help     = "Seconds each hook may take; absent means the hook_seconds of releasables.toml's [timeouts], which must then state it."
optional = true
at-least = 1

[[field-set]]
name = "new-releasable"

[[field-set.field]]
name     = "tag-format"
type     = "string"
help     = "The tag format of the releasable the command creates, holding {version} and optionally {name}; absent means no releasable is created."
optional = true

[[field-set.field]]
name     = "publish-mode"
type     = "string"
help     = "The publish mode of the releasable the command creates; absent means no releasable is created or the source's own mode is kept."
optional = true
choices  = [
  { value = "ci", help = "publish from CI." },
  { value = "none", help = "publish nothing to any registry." },
]

[[field-set.field]]
name     = "license"
type     = "string"
help     = "The SPDX identifier or proprietary license of the releasable the command creates; absent means no releasable is created."
optional = true

[[field-set.field]]
name     = "registry-name"
type     = "string"
help     = "The member's name on the registries; absent means the registries know it by its own name."
optional = true

