name = "release-progress"

[[field-set.field]]
name = "releasable"
type = "string"
help = "The releasable being released."

[[field-set.field]]
name = "version"
type = "string"
help = "The version being released, bare."

[[field-set.field]]
name = "candidate"
type = "string"
help = "The commit pushed as the release candidate, empty before the push."

[[field-set.field]]
name = "completed-steps"
type = "string"
help = "Release steps already done, in the order the in-progress file records them."
list = true

[[field-set.field]]
name = "pending"
type = "string"
help = "Work items of the current step not yet answered, such as tags still to push."
list = true

[[field-set]]
name = "rewrite-progress"

[[field-set.field]]
