consequential = false
flag-sets     = ["commit-choice"]
render        = true

[[command.flag]]
name = "current"
type = "string"
help = "The value the repository runs the option at now."

[[command.flag]]
name = "ideal"
type = "string"
help = "The value the repository should run the option at, never ranked below current, or non-existent."

[[command.flag]]
name = "reason"
type = "string"
help = "Why the repository deviates from the option's default, in one sentence."

[[command.flag]]
