[[command.selector]]
name = "root-member"
help = "What the root member is."

[[command.selector.member]]
name     = "root-dev-node"
help     = "The root member is dev-only and versioned under no releasable."
presence = true

[[command.selector.member]]
name     = "root-releasable"
help     = "The root member is versioned under a releasable created with it."
presence = true

[[command.selector.member.flag]]
name = "releasable"
type = "string"
help = "The name of the releasable the root member is versioned under."

[[command.selector.member.flag]]
name = "tag-format"
type = "string"
help = "The releasable's tag format holding {version} and optionally {name}."

[[command.selector.member.flag]]
name    = "publish-mode"
type    = "string"
help    = "The releasable's publish mode."
choices = [
  { value = "ci", help = "publish from CI." },
  { value = "none", help = "publish nothing to any registry." },
]

[[command.selector.member.flag]]
name     = "publish-ci-check-pattern"
type     = "string"
help     = "The pattern of the check-run names the root's own CI reports, which publishing waits for; absent is refused with --publish-mode ci."
optional = true

[[command.selector.member.flag]]
name = "license"
type = "string"
help = "The releasable's SPDX identifier or proprietary."

[[command.carry]]
name = "step"

[[command.carry.field]]
name = "step"
type = "string"
help = "Which step of the command the answer belongs to, so the completion handler resumes the right one."

[[command.carry.field]]
name = "subject"
type = "string"
help = "The ref, tag, file, member, or version the step acts on, so the completion handler knows which one answered."

[[command.exit]]
code    = 1
name    = "failed"
meaning = "The command refused its input or the repository's state, or a read, program, or request it needed failed, and said why."

[command.chain]
start = ["github-reading program version", "github-reading credential check", "github-reading api get"]

[[command.chain.next]]
after = "github-reading program version"
may   = ["github-reading credential check"]

[[command.chain.next]]
after = "github-reading credential check"
may   = ["github-reading api get"]

[[command.chain.next]]
after = "github-reading api get"
may   = ["safegit-commits authored-files commit"]

[[command.chain.next]]
after = "safegit-commits authored-files commit"
may   = ["saferm-deletion leftover delete"]

[[command]]
path          = "monorepo list"
help          = "List every member the workspace declares, in declaration order, with its path, releasable, and flags."
consequential = false
render        = true

[[command.output]]
name = "members"
type = "declared-member"
help = "Every declared member."
list = true

[[command.exit]]
code    = 1
name    = "failed"
meaning = "The command refused its input or the repository's state, or a read, program, or request it needed failed, and said why."

[[command]]
path          = "monorepo dependencies list"
help          = "List every dependency between members with the version the depended-on member has now and whether the constraint admits it."
consequential = false
render        = true

[[command.output]]
name = "dependencies"
type = "member-dependency"
help = "Every dependency between members."
list = true

[[command.exit]]
code    = 1
name    = "failed"
meaning = "The command refused its input or the repository's state, or a read, program, or request it needed failed, and said why."

[[command]]
path          = "monorepo remove"
help          = "Delete the declaration of the member at the path as releasables.toml writes it, leaving its files on disk and committing nothing."
consequential = false

[[command.arg]]
name = "path"
type = "string"
help = "The member's path, character for character as releasables.toml writes it."

[[command.exit]]
code    = 1
name    = "failed"
meaning = "The command refused its input or the repository's state, or a read, program, or request it needed failed, and said why."

[[command]]
path               = "monorepo releasable rename"
help               = "Rename a releasable everywhere the declarations and records name it, regenerate the routers, and commit it as one commit."
consequential      = true
approval-valid-for = "1h"
outstanding        = 4

[[command.arg]]
name = "old-name"
type = "string"
help = "The releasable's name now."

[[command.arg]]
name = "new-name"
type = "string"
help = "The name it takes."

[[command.carry]]
name = "step"

[[command.carry.field]]
name = "step"
type = "string"
help = "Which step of the command the answer belongs to, so the completion handler resumes the right one."

[[command.carry.field]]
name = "subject"
type = "string"
help = "The ref, tag, file, member, or version the step acts on, so the completion handler knows which one answered."

[[command.exit]]
code    = 1
name    = "failed"
meaning = "The command refused its input or the repository's state, or a read, program, or request it needed failed, and said why."

[command.chain]
start = ["run-state writer hold"]

[[command.chain.next]]
after = "run-state writer hold"
may   = [
  "github-reading program version", "saferm-deletion leftover delete", "safegit-commits authored-files commit",
  "safegit-commits generated-files commit", "git-writing ref create", "git-writing remote-refs list",
]

[[command.chain.next]]
after = "github-reading program version"
may   = ["github-reading credential check"]

[[command.chain.next]]
after = "github-reading credential check"
may   = ["github-reading api get"]

[[command.chain.next]]
after = "github-reading api get"
may   = [
  "saferm-deletion file delete", "safegit-commits generated-files commit",
  "safegit-commits authored-files commit",
]

[[command.chain.next]]
after = "git-writing remote-refs list"
may   = ["git-writing ref create", "git-writing ref push", "safegit-commits generated-files commit"]

[[command.chain.next]]
after = "git-writing ref push"
may   = ["safegit-commits generated-files commit"]

[[command]]
path          = "monorepo status show"
help          = "Report every releasable of the workspace with its lifecycle, version, latest release, and coverage, and every member with its targets, version, and dependencies."
consequential = false
render        = true

[[command.output]]
name = "releasables"
type = "releasable-status"
help = "Every declared releasable."
list = true

[[command.output]]
name = "members"
type = "member-status"
help = "Every declared member."
list = true

[[command.exit]]
code    = 1
name    = "failed"
meaning = "The command refused its input or the repository's state, or a read, program, or request it needed failed, and said why."

[[command]]
path          = "monorepo sync"
help          = "Regenerate the workspace's CI router and publish router from the members' workflows, removing generated routers and copies nothing uses."
consequential = false
outstanding   = 4
flag-sets     = ["commit-choice"]
render        = true

[[command.output]]
name = "written"
type = "string"
help = "The files written."
list = true

[[command.output]]
name = "removed"
type = "string"
help = "The files removed."
list = true

[[command.output]]
name = "import-names"
type = "import-name"
help = "The import names declared for members whose Python package directory differs from their name."
list = true
wire = "import_names"

[[command.output]]
name = "committed"
type = "boolean"
help = "Whether what was written and removed was committed."

[[command.carry]]
name = "step"

[[command.carry.field]]
name = "step"
type = "string"
help = "Which step of the command the answer belongs to, so the completion handler resumes the right one."

[[command.carry.field]]
name = "subject"
type = "string"
help = "The ref, tag, file, member, or version the step acts on, so the completion handler knows which one answered."

[[command.exit]]
code    = 1
name    = "failed"
meaning = "The command refused its input or the repository's state, or a read, program, or request it needed failed, and said why."

[command.chain]
start = ["github-reading program version", "github-reading credential check", "github-reading api get"]

[[command.chain.next]]
after = "github-reading program version"
may   = ["github-reading credential check"]

[[command.chain.next]]
after = "github-reading credential check"
may   = ["github-reading api get"]

[[command.chain.next]]
after = "github-reading api get"
may   = ["github-reading api get", "saferm-deletion file delete", "safegit-commits generated-files commit"]
limit = 100

[[command]]
path          = "monorepo release init"
help          = "Write the batch release file with one blank table per releasable named, or every declared one, and commit it."
consequential = false

[[command.flag]]
name   = "releasables"
type   = "string"
help   = "A releasable to write a table for, repeatable; empty requires --all."
list   = true
unique = true

[[command.flag]]
name = "all"
type = "boolean"
help = "Write a table for every declared releasable, or only for the ones --releasables names."

[[command.exit]]
code    = 1
name    = "failed"
meaning = "The command refused its input or the repository's state, or a read, program, or request it needed failed, and said why."

[command.chain]
start = ["safegit-commits authored-files commit"]

[[command]]
path          = "monorepo release order show"
help          = "Report every member after the members it depends on, and every releasable in the order a batch release releases them."
consequential = false
render        = true

[[command.output]]
name = "members"
type = "string"
help = "Every member, each after the members it depends on."
list = true

[[command.output]]
name = "releasables"
type = "string"
help = "Every releasable in batch release order."
list = true

[[command.output]]
name = "independent"
type = "boolean"
help = "Whether no releasable depends on another."

[[command.exit]]
code    = 1
name    = "failed"
meaning = "The command refused its input or the repository's state, or a read, program, or request it needed failed, and said why."

[[command]]
path               = "monorepo release run"
help               = "Release the releasables the batch release file names, in dependency order, as one candidate CI verifies once before each is tagged and published."
consequential      = true
approval-valid-for = "1h"
outstanding        = 8
flag-sets          = ["release-timeouts"]
state-sets         = ["release-progress"]

[[command.flag]]
name = "watch"
type = "boolean"
help = "Watch CI on each release commit afterwards and verify the registries list each version, or say it was not verified."

[[command.state]]
name = "phase"
type = "string"
help = "The step of the release the run is in, as the in-progress file names it."

[[command.carry]]
name = "step"

[[command.carry.field]]
name = "step"
type = "string"
help = "Which step of the command the answer belongs to, so the completion handler resumes the right one."

[[command.carry.field]]
name = "subject"
type = "string"
help = "The ref, tag, file, member, or version the step acts on, so the completion handler knows which one answered."

[[command.exit]]
code    = 1
name    = "failed"
meaning = "The command refused its input or the repository's state, or a read, program, or request it needed failed, and said why."

