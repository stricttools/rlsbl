name = "subject"
type = "string"
help = "The ref, tag, file, member, or version the step acts on, so the completion handler knows which one answered."

[[command.exit]]
code    = 1
name    = "failed"
meaning = "The command refused its input or the repository's state, or a read, program, or request it needed failed, and said why."

[command.chain]
start = ["github-reading program version"]

[[command.chain.next]]
after = "github-reading program version"
may   = ["github-reading credential check"]

[[command.chain.next]]
after = "github-reading credential check"
may   = ["github-reading api get"]

[[command.chain.next]]
after = "github-reading api get"
may   = []

[[command]]
path               = "transition unversioned-tag add"
help               = "Record a tag that releases no version, so backfill, reconcile, and the tag checks account for it instead of reporting it."
consequential      = true
approval-valid-for = "1h"

[[command.flag]]
name = "tag"
type = "string"
help = "The tag that releases no version."

[[command.flag]]
name = "reason"
type = "string"
help = "Why, in the operator's own words, which the record keeps."

[[command.exit]]
code    = 1
name    = "failed"
meaning = "The command refused its input or the repository's state, or a read, program, or request it needed failed, and said why."

[command.chain]
start = ["safegit-commits generated-files commit"]

[[command]]
path               = "upstream tags adopt"
help               = "Move the tags this fork inherited from its upstream out of refs/tags into a kept namespace, here and on origin, one tag and one ref per push."
consequential      = true
approval-valid-for = "1h"
outstanding        = 1

[[command.carry]]
name = "step"

[[command.carry.field]]
name = "step"
type = "string"
help = "Which step of the command the answer belongs to, so the completion handler resumes the right one."

[[command.carry.field]]
name = "subject"
type = "string"
help = "The ref, tag, file, member, or version the step acts on, so the completion handler knows which one answered."

[[command.exit]]
code    = 1
name    = "failed"
meaning = "The command refused its input or the repository's state, or a read, program, or request it needed failed, and said why."

[command.chain]
start = ["git-writing remote-refs list"]

[[command.chain.next]]
after = "git-writing remote-refs list"
may   = [
  "git-writing remote-refs list", "git-writing ref create", "git-writing ref push",
  "git-writing ref lease-push", "git-writing ref delete",
]
limit = 10
