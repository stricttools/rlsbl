[[command]]
path               = "transition identity add"
help               = "Record an identity period of a subject: a releasable name, package name, project name, Go module path, tag format, or repository address, with the tags it owned."
consequential      = true
approval-valid-for = "1h"

[[command.flag]]
name = "subject"
type = "string"
help = "The releasable or member the period belongs to."

[[command.flag]]
name    = "facet"
type    = "string"
help    = "Which identity it is."
choices = [
  { value = "releasable-name", help = "the releasable's name." },
  { value = "package-name", help = "a published package's name." },
  { value = "project-name", help = "the project's name." },
  { value = "go-module-path", help = "a Go module path." },
  { value = "tag-format", help = "the tag format." },
  { value = "repository-url", help = "the repository's address." },
]

[[command.flag]]
name = "value"
type = "string"
help = "The identity's value: the name, path, format, or address."

[[command.flag]]
name     = "registry"
type     = "string"
help     = "The registry the value is a name in; absent means an identity that is not a registry name."
optional = true
choices  = [
  { value = "npm", help = "the npm registry." },
  { value = "pypi", help = "the Python Package Index." },
  { value = "go", help = "the Go module proxy." },
]

[[command.flag]]
name   = "tag-pattern"
type   = "string"
help   = "A glob of the tags the identity owned while its period ran, repeatable; empty means it owned none."
list   = true
unique = true

[[command.flag]]
name     = "from"
type     = "string"
help     = "The identity's first day as YYYY-MM-DD; absent means today, closing the open identity of the facet."
optional = true

[[command.flag]]
name     = "until"
type     = "string"
help     = "The first day after a closed identity as YYYY-MM-DD; absent means the identity is open."
optional = true

[[command.flag]]
name = "reason"
type = "string"
help = "Why, in the operator's own words, which the record keeps."

[[command.constraint]]
class    = "requires"
flag     = "until"
requires = "from"

[[command.exit]]
code    = 1
name    = "failed"
meaning = "The command refused its input or the repository's state, or a read, program, or request it needed failed, and said why."

[command.chain]
start = ["safegit-commits generated-files commit"]

