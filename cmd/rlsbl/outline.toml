[[type]]
name = "name-verdict"

[[type.field]]
name = "name"
type = "string"
help = "The candidate name checked."

[[type.field]]
name    = "target"
type    = "string"
help    = "The registry or rule set it was checked against."
choices = ["npm", "pypi", "go"]

[[type.field]]
name    = "status"
type    = "string"
help    = "The verdict."
choices = [
  { value = "available", help = "nothing holds or collides with the name." },
  { value = "taken", help = "the name or a colliding one is registered, or names a standard-library package." },
  { value = "invalid", help = "the name cannot be a Go package name." },
  { value = "discouraged", help = "Go accepts the name and its style guidance advises against it." },
  { value = "error", help = "the registry could not answer about the name or a similar one." },
]

[[type.field]]
name     = "reason"
type     = "string"
help     = "Why the verdict is not available; null when it is."
optional = true
choices  = [
  "registered", "stdlib", "moniker", "normalized", "ultranorm", "not-identifier", "keyword", "blank",
  "uppercase", "underscore", "predeclared",
]

[[type.field]]
name = "exit-code"
type = "integer"
help = "The exit code this verdict alone would give: 0, 1, or 2."
wire = "exit_code"

