[[command]]
path               = "release scrub"
help               = "Scrub content from the repository's history through safegit, repair every record the rewrite renamed, and force-push the result guarded by what origin held before."
consequential      = true
approval-valid-for = "1h"
outstanding        = 1
state-sets         = ["rewrite-progress"]

[[command.flag]]
name     = "pattern"
type     = "string"
help     = "A regular expression whose every match is rewritten; absent means --file or --recipe names the scrub."
optional = true

[[command.flag]]
name     = "replace"
type     = "string"
help     = "With --pattern, the literal text each match is replaced with; absent is refused unless --mangle is given."
optional = true

[[command.flag]]
name = "mangle"
type = "boolean"
help = "With --pattern, replace each match with random text of the same length, or with the text --replace gives."

[[command.flag]]
name     = "file"
type     = "string"
help     = "A repository-relative file whose every past version is replaced by the copy on disk, or removed when there is none; absent means --pattern or --recipe names the scrub."
optional = true

[[command.flag]]
name     = "recipe"
type     = "string"
help     = "The path of a safegit scrub recipe; absent means --pattern or --file names the scrub."
optional = true
role     = "file"

[[command.flag]]
name = "reason"
type = "string"
help = "Why the content is scrubbed, recorded in the scrub commit and the rewrite's archive."

[[command.selector]]
name = "range-start"
help = "Where the rewritten range of history begins."

[[command.selector.member]]
name = "from-commit"
help = "The earliest commit rewritten."
type = "string"

[[command.selector.member]]
name     = "entire-history"
help     = "Rewrite the whole history."
presence = true

[[command.constraint]]
class = "one-of"
flags = ["pattern", "file", "recipe"]

[[command.carry]]
name = "step"

[[command.carry.field]]
name = "step"
type = "string"
help = "Which step of the command the answer belongs to, so the completion handler resumes the right one."

[[command.carry.field]]
name = "subject"
type = "string"
help = "The ref, tag, file, member, or version the step acts on, so the completion handler knows which one answered."

[[command.exit]]
code    = 1
name    = "failed"
meaning = "The command refused its input or the repository's state, or a read, program, or request it needed failed, and said why."

[command.chain]
start = ["run-state writer hold"]

[[command.chain.next]]
after = "run-state writer hold"
may   = ["safegit-commits program version"]

[[command.chain.next]]
after = "safegit-commits program version"
may   = ["git-writing remote-refs list"]

[[command.chain.next]]
after = "git-writing remote-refs list"
may   = [
  "history-rewriting pattern-scrub preview", "history-rewriting file-scrub preview",
  "history-rewriting recipe-scrub preview", "safegit-commits generated-files commit",
  "git-writing ref lease-push",
]

[[command.chain.next]]
after = "history-rewriting pattern-scrub preview"
may   = ["history-rewriting pattern-scrub apply"]

[[command.chain.next]]
after = "history-rewriting file-scrub preview"
may   = ["history-rewriting file-scrub apply"]

[[command.chain.next]]
after = "history-rewriting recipe-scrub preview"
may   = ["history-rewriting recipe-scrub apply"]

[[command.chain.next]]
after = "history-rewriting pattern-scrub apply"
may   = ["safegit-commits generated-files commit", "git-writing ref lease-push"]

[[command.chain.next]]
after = "history-rewriting file-scrub apply"
may   = ["safegit-commits generated-files commit", "git-writing ref lease-push"]

[[command.chain.next]]
after = "history-rewriting recipe-scrub apply"
may   = ["safegit-commits generated-files commit", "git-writing ref lease-push"]

[[command.chain.next]]
after = "git-writing ref lease-push"
may   = ["git-writing ref lease-push", "github-reading program version"]
limit = 5000

[[command.chain.next]]
after = "github-reading program version"
may   = ["github-reading credential check"]

[[command.chain.next]]
after = "github-reading credential check"
may   = ["github-reading release show"]

[[command.chain.next]]
after = "github-reading release show"
may   = ["github-reading release show", "github-writing release edit", "github-writing release create"]
limit = 5000

[[command.chain.next]]
after = "github-writing release edit"
may   = ["github-reading release show"]
limit = 5000

[[command.chain.next]]
after = "github-writing release create"
may   = ["github-reading release show"]
limit = 5000

[[command]]
path               = "release undo"
help               = "Revert a release that no registry or workflow published: delete its GitHub Release and tags, restore its changelog and release file, and revert its version bump when it is the latest."
consequential      = true
approval-valid-for = "1h"
outstanding        = 1

[[command.flag]]
name     = "version"
type     = "string"
help     = "An earlier release to undo without reverting its commits, bare; absent means the latest release, whose commits are reverted."
optional = true

[[command.carry]]
name = "step"

