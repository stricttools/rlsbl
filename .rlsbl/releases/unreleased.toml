dead-modules gained a reason-gated committed exclusion list.
check-name gained --json plus a fix making multi-target checks actually check every target.
The launcher pipeline kind is now end-to-end functional with checksum-verified download shims.
rename-releasable crash recovery and batch-archival guards were hardened, and the release preflight now prints a positive success summary.
"""
