# Version bump type: patch, minor, major, hotfix, or prerelease
bump = "patch"
# Short description of this release (required)
description = "CI fixes: gitleaks install in CI workflows, inline monorepo CI router (GitHub rejects routers with >20 reusable workflow calls), reusable-call guard."
# Optional context explaining why these changes were made
context = "A monorepo's CI router had been broken since June 24 because GitHub Actions rejects workflows with more than 20 reusable workflow calls. The router is now inlined per-package, a guard check prevents regenerating routers that exceed the limit, and gitleaks is installed in CI so the secret-scan gate works in workflows."
# Pre-release identifier: alpha, beta, rc, or stable
# preid = ""
# Set to true to generate a blog post for this release
# blog = false
include = ["npm", "pypi"]
exclude = []
