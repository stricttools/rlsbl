# strictspec document version gate (do not remove)
format_version = 1
# Version bump type: patch, minor, major, infra, or prerelease
#   prerelease: advance an existing pre-release (0.6.0-beta.0 -> -beta.1)
bump = "patch"
# Short description of this release (required)
description = "Fixes two data-corrupting defects in releasable migration: changelog entries no longer lose their stable ids through consolidation, and a releasable's own unreleased entries are no longer destroyed when no member has entries."
# Optional context explaining why these changes were made
context = """
This patch precedes a larger conversion-and-workspace campaign. Workspaces
whose migration to the releasable model is deliberately deferred will pin
this release, so the migration path they run must not corrupt changelog
history. The two fixes make `monorepo migrate-releasable` safe for that:
entry ids survive consolidation (keeping `changelog amend --id` and
`changelog edit --id` addressable), and a releasable's pre-existing
unreleased entries survive when members contribute none.
"""
# Pre-release channel: alpha, beta, rc, or stable (ordered;
# demotion is an error). With patch/minor/major it ENTERS the
# channel (0.5.2 + minor + alpha -> 0.6.0-alpha.0); with
# bump = "prerelease" it promotes, and "stable" strips the
# suffix. See docs/release-workflow.md#the-pre-release-channel.
# preid = ""
# Set to true to generate a blog post for this release
# blog = false
include = ["npm", "pypi"]
exclude = []
