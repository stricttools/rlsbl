# Version bump type: patch, minor, major, hotfix, or prerelease
bump = "minor"
# Short description of this release (required)
description = "Migrated all boolean CLI flags to explicit-default style via strictcli."
# Optional context explaining why these changes were made
context = "All bool flags now use --flag/--no-flag syntax with explicit defaults. Multiple renames: --no-commit to --auto-commit, --no-tag to --auto-tag, --no-resolve to --validate-hashes, --force to --force-overwrite on scaffold. --watch and --allow-dirty are now required flags with no default."
# Pre-release identifier: alpha, beta, rc, or stable
# preid = ""
# Set to true to generate a blog post for this release
# blog = false
include = ["npm", "pypi"]
exclude = []
