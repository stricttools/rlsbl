# Version bump type: patch, minor, or major
bump = "minor"
# Short description of this release (required)
description = "Releasable model: groups of packages sharing a version, changelog, and release lifecycle"
# Optional context explaining why these changes were made
context = """
Introduces the releasable model — a ground-up redesign of monorepo versioning.
Instead of per-package versioning (N versions, N changelogs, N tags), packages
can be grouped into releasables that share a single version, changelog, and
release lifecycle. The model covers the full stack: data model, version
management, changelog scoping, release flow, hooks, scaffold, migration
tooling, extract/absorb operations, and single-project unification.

Breaking: dev_node is split into dev_only (boundary guardrail) and
releasable = false (not versioned). The --dev-node CLI flag is renamed to
--dev-only. The dev-node-boundary check is renamed to dev-only-boundary.
"""
# Set to true to generate a blog post for this release
# blog = false
include = ["npm", "pypi"]
exclude = []
