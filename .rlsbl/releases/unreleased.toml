# Version bump type: patch, minor, major, hotfix, or prerelease
bump = "patch"
# Short description of this release (required)
description = "Fix CI_CHECK_REGEX in publish router to match actual GitHub check-run names"
# Optional context explaining why these changes were made
context = "The monorepo CI router generates job keys from CI workflow filenames (e.g. core-ci from core-ci.yml), but the publish router gate was using project names (e.g. core) in the regex. This caused the gate to never find matching check runs, timing out after the grace window."
# Pre-release identifier: alpha, beta, rc, or stable
# preid = ""
# Set to true to generate a blog post for this release
# blog = false
include = ["npm", "pypi"]
exclude = []
