context = "GitHub Release notes sync (rlsbl release edit) now works for explicit-mode releasables instead of failing with 'CHANGELOG.md not found', and amended releasable changelog entries now render with their [name] prefix like added entries."
# Pre-release identifier: alpha, beta, rc, or stable
# preid = ""
# Set to true to generate a blog post for this release
# blog = false
include = ["npm", "pypi"]
exclude = []
