# strictspec schema for one line of the transition record,
# .strictmetadata/transitions/transitions.jsonl: one repository-surgery fact
# per line, selected by `event`. The record holds surgery only; renames,
# identities, closed release histories, and tags outside the version model
# are facts of the lifecycle-and-license record.
#
# The generated Go validator (internal/releaserecord/transitionspec) checks
# each line; internal/releaserecord checks what one line cannot show: the
# uniqueness of ids across the file.

name = "rlsbl-transition-record-event"
meta_version = 1
format_version = 2
document_syntax = "jsonl"
role = "schema"
root = "TransitionEvent"
description = "One transition record line: a single repository-surgery fact, selected by `event`."

[types.GitSha]
type = "string"
regex = "^[0-9a-f]{7,64}$"
description = "A git commit id: full (40 hexadecimal digits, or 64 in a SHA-256 repository) or abbreviated to at least 7. Writers record the full form."

[types.Endpoint]
type = "record"
description = "One side of a conversion: which repository, and which part of it."

[types.Endpoint.fields.repo]
type = "string"
required = true
non_empty = true
description = "The repository: a remote URL for a repository other than the one holding this record, or \".\" for this repository."

[types.Endpoint.fields.path]
type = "string"
required = false
non_empty = true
description = "The repository-relative directory of this side; absent means the repository root."

[types.Endpoint.fields.project]
type = "string"
required = false
non_empty = true
description = "The workspace member name at this side, when it is inside a workspace."

[types.Endpoint.fields.releasable]
type = "string"
required = false
non_empty = true
description = "The releasable name at this side, when a releasable versions it."

[types.Endpoint.fields.tag_format]
type = "string"
required = false
non_empty = true
description = "The tag format in effect at this side; a conversion is where it changes."

[types.TagMapping]
type = "record"
description = "One old-tag to new-tag correspondence."

[types.TagMapping.fields.old_tag]
type = "string"
required = true
non_empty = true
description = "The tag as it was before the conversion."

[types.TagMapping.fields.new_tag]
type = "string"
required = true
non_empty = true
description = "The tag after the conversion."

[types.TagMapping.fields.old_commit]
type = "GitSha"
required = false
description = "The commit the old tag pointed at in the history before the rewrite; absent when the writer did not have that history."

[types.TagMapping.fields.new_commit]
type = "GitSha"
required = true
description = "The commit the new tag points at in this repository."

[types.CommitMapping]
type = "record"
description = "One old-commit to new-commit correspondence a history rewrite produced."

[types.CommitMapping.fields.old_sha]
type = "GitSha"
required = true
description = "The commit before the rewrite, usually no longer in this repository."

[types.CommitMapping.fields.new_sha]
type = "GitSha"
required = true
description = "The commit after the rewrite."

[types.BoundaryAlias]
type = "record"
description = "One alias tag created at a boundary."

[types.BoundaryAlias.fields.alias_tag]
type = "string"
required = true
non_empty = true
description = "The alias tag created, in the tag format after the boundary."

[types.BoundaryAlias.fields.aliased_tag]
type = "string"
required = true
non_empty = true
description = "The existing tag the alias duplicates, in the tag format before the boundary."

[types.BoundaryAlias.fields.commit]
type = "GitSha"
required = true
description = "The commit both tags point at."

[types.ConversionEvent]
type = "record"
description = "A repository conversion: a releasable extracted out of a workspace into a repository of its own, or an external repository absorbed into a workspace."

[types.ConversionEvent.fields.format_version]
type = "literal"
value = 2
required = true
description = "The line's format version."

[types.ConversionEvent.fields.event]
type = "literal"
value = "conversion"
required = true
description = "Which event the line records."

[types.ConversionEvent.fields.id]
type = "string"
required = true
non_empty = true
description = "The event's identifier, unique within the file. rlsbl writes 16 hexadecimal digits of a nanosecond timestamp followed by 32 of a random UUID4. Other events name it in related_to."

[types.ConversionEvent.fields.recorded_at]
type = "datetime"
required = true
datetime_kind = "offset"
description = "When the event was appended (RFC 3339, with offset)."

[types.ConversionEvent.fields.related_to]
type = "string"
required = false
non_empty = true
description = "The id of an earlier event this one elaborates."

[types.ConversionEvent.fields.direction]
type = "enum"
required = true
values = ["extract", "absorb"]
description = "\"extract\" moved a releasable out of a workspace into its own repository; \"absorb\" moved an external repository in as a member."

[types.ConversionEvent.fields.source]
type = "Endpoint"
required = true
description = "Where the code came from."

[types.ConversionEvent.fields.destination]
type = "Endpoint"
required = true
description = "Where the code went."

[types.ConversionEvent.fields.commit]
type = "GitSha"
required = true
description = "The commit in this repository at which the conversion took effect: the merge or rewrite commit of an absorb, the last commit before the removal of an extract."

[types.TagMapEvent]
type = "record"
description = "The tag renames a conversion performed, apart from the conversion event because one conversion may rename hundreds of tags."

[types.TagMapEvent.fields.format_version]
type = "literal"
value = 2
required = true
description = "The line's format version."

[types.TagMapEvent.fields.event]
type = "literal"
value = "tag-map"
required = true
description = "Which event the line records."

[types.TagMapEvent.fields.id]
type = "string"
required = true
non_empty = true
description = "The event's identifier, unique within the file. rlsbl writes 16 hexadecimal digits of a nanosecond timestamp followed by 32 of a random UUID4. Other events name it in related_to."

[types.TagMapEvent.fields.recorded_at]
type = "datetime"
required = true
datetime_kind = "offset"
description = "When the event was appended (RFC 3339, with offset)."

[types.TagMapEvent.fields.related_to]
type = "string"
required = false
non_empty = true
description = "The id of the conversion event whose tags these are."

[types.TagMapEvent.fields.releasable]
type = "string"
required = false
non_empty = true
description = "The releasable a workspace scopes this event to; absent when the event concerns the whole repository."

[types.TagMapEvent.fields.mappings]
type = "array"
required = true
min_len = 1
description = "The tag renames."
[types.TagMapEvent.fields.mappings.item]
type = "TagMapping"

[types.ReleaseCommitRemapEvent]
type = "record"
description = "The commit correspondence a history rewrite produced for the commits rlsbl's records name: release commits, changelog commits, and the commits of earlier events."

[types.ReleaseCommitRemapEvent.fields.format_version]
type = "literal"
value = 2
required = true
description = "The line's format version."

[types.ReleaseCommitRemapEvent.fields.event]
type = "literal"
value = "release-commit-remap"
required = true
description = "Which event the line records."

[types.ReleaseCommitRemapEvent.fields.id]
type = "string"
required = true
non_empty = true
description = "The event's identifier, unique within the file. rlsbl writes 16 hexadecimal digits of a nanosecond timestamp followed by 32 of a random UUID4. Other events name it in related_to."

[types.ReleaseCommitRemapEvent.fields.recorded_at]
type = "datetime"
required = true
datetime_kind = "offset"
description = "When the event was appended (RFC 3339, with offset)."

[types.ReleaseCommitRemapEvent.fields.related_to]
type = "string"
required = false
non_empty = true
description = "The id of the conversion event whose rewrite produced this mapping."

[types.ReleaseCommitRemapEvent.fields.releasable]
type = "string"
required = false
non_empty = true
description = "The releasable a workspace scopes this event to; absent when the event concerns the whole repository."

[types.ReleaseCommitRemapEvent.fields.rewrite]
type = "string"
required = true
non_empty = true
description = "What performed the rewrite, in the writer's own words. It explains the mapping to a reader and is never dispatched on."

[types.ReleaseCommitRemapEvent.fields.mappings]
type = "array"
required = true
min_len = 1
description = "The old-to-new commit pairs. A rewrite that moved nothing is not recorded."
[types.ReleaseCommitRemapEvent.fields.mappings.item]
type = "CommitMapping"

[types.DepartedGlobsEvent]
type = "record"
description = "Tag globs that stopped belonging to this repository because the releasable they named was extracted. A tag still matching one is what the releasable left behind, not a live release."

[types.DepartedGlobsEvent.fields.format_version]
type = "literal"
value = 2
required = true
description = "The line's format version."

[types.DepartedGlobsEvent.fields.event]
type = "literal"
value = "departed-globs"
required = true
description = "Which event the line records."

[types.DepartedGlobsEvent.fields.id]
type = "string"
required = true
non_empty = true
description = "The event's identifier, unique within the file. rlsbl writes 16 hexadecimal digits of a nanosecond timestamp followed by 32 of a random UUID4. Other events name it in related_to."

[types.DepartedGlobsEvent.fields.recorded_at]
type = "datetime"
required = true
datetime_kind = "offset"
description = "When the event was appended (RFC 3339, with offset)."

[types.DepartedGlobsEvent.fields.related_to]
type = "string"
required = false
non_empty = true
description = "The id of the conversion event that made these globs depart."

[types.DepartedGlobsEvent.fields.globs]
type = "array"
required = true
min_len = 1
description = "The tag globs that left, each a tag format with its version replaced by '*'."
[types.DepartedGlobsEvent.fields.globs.item]
type = "string"
non_empty = true

[types.DepartedGlobsEvent.fields.destination]
type = "Endpoint"
required = true
description = "Where the releasable went."

[types.BoundaryAliasEvent]
type = "record"
description = "Alias tags created at a conversion or a rename, so the version released just before it is addressable under the new tag format too. Earlier releases keep their original tags."

[types.BoundaryAliasEvent.fields.format_version]
type = "literal"
value = 2
required = true
description = "The line's format version."

[types.BoundaryAliasEvent.fields.event]
type = "literal"
value = "boundary-alias"
required = true
description = "Which event the line records."

[types.BoundaryAliasEvent.fields.id]
type = "string"
required = true
non_empty = true
description = "The event's identifier, unique within the file. rlsbl writes 16 hexadecimal digits of a nanosecond timestamp followed by 32 of a random UUID4. Other events name it in related_to."

[types.BoundaryAliasEvent.fields.recorded_at]
type = "datetime"
required = true
datetime_kind = "offset"
description = "When the event was appended (RFC 3339, with offset)."

[types.BoundaryAliasEvent.fields.related_to]
type = "string"
required = false
non_empty = true
description = "The id of the conversion event these aliases mark the boundary of."

[types.BoundaryAliasEvent.fields.releasable]
type = "string"
required = false
non_empty = true
description = "The releasable a workspace scopes this event to; absent when the event concerns the whole repository."

[types.BoundaryAliasEvent.fields.aliases]
type = "array"
required = true
min_len = 1
description = "The alias tags created."
[types.BoundaryAliasEvent.fields.aliases.item]
type = "BoundaryAlias"

[types.TransitionEvent]
type = "discriminated-union"
discriminator = "event"
description = "One transition record line. `event` selects the record type; an unrecognized event is refused, never skipped."

[types.TransitionEvent.arms.conversion]
type = "ConversionEvent"

[types.TransitionEvent.arms.tag-map]
type = "TagMapEvent"

[types.TransitionEvent.arms.release-commit-remap]
type = "ReleaseCommitRemapEvent"

[types.TransitionEvent.arms.departed-globs]
type = "DepartedGlobsEvent"

[types.TransitionEvent.arms.boundary-alias]
type = "BoundaryAliasEvent"
