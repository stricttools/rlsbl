# strictspec schema for one rlsbl JSONL changelog line -- CHANGESET-FILE mode.
# Source of truth: rlsbl/changelog/schema.py (ChangelogEntry, validate_schema
# with coverage_unit="changeset-file"). Sibling of the commit-mode schema; the
# consumer selects which schema to validate against from .rlsbl/config.json's
# coverage_unit (explicit mode selection).
#
# The ONLY structural differences from commit mode: commits is FORBIDDEN, id is
# REQUIRED. Everything else (per-line format_version, user_facing,
# description/type conditional-required, release_type, packages) is identical.
#
# commits is FORBIDDEN in changeset-file mode. strictspec has no positive
# "this field must always be absent" construct: a forbidden field is simply one
# the closed record does NOT declare, so a present commits is an unknown-key
# error. rlsbl renders that verdict as "commits must be empty in changeset-file
# mode" (validate_schema).

name = "rlsbl-changelog-entry-changeset-file"
meta_version = 1
format_version = 1
document_syntax = "jsonl"
role = "schema"
root = "ChangelogEntry"
targets = ["python"]
description = "One JSONL changelog line in changeset-file mode: commits forbidden, id required."

[types.ChangelogEntry]
type = "record"

[types.ChangelogEntry.fields.format_version]
type = "integer"
required = true
description = "Per-line format_version (JSONL per-line gate)."

[types.ChangelogEntry.fields.user_facing]
type = "boolean"
required = true
description = "Whether this entry appears in the published changelog."

[types.ChangelogEntry.fields.description]
type = "string"
required = false
non_empty = true
description = "Markdown one-liner. REQUIRED WHEN user_facing == true (see constraint)."

[types.ChangelogEntry.fields.type]
type = "enum"
required = false
values = ["feature", "fix", "breaking"]
description = "Entry type. REQUIRED WHEN user_facing == true (see constraint)."

[types.ChangelogEntry.fields.release_type]
type = "enum"
required = false
values = ["ota", "build"]
description = "Flutter target release channel. Optional, unconstrained by user_facing."

[types.ChangelogEntry.fields.id]
type = "string"
required = true
non_empty = true
description = "Stable identifier. REQUIRED in changeset-file mode (validate_schema: \"id is required in changeset-file mode\")."

[types.ChangelogEntry.fields.packages]
type = "array"
required = false
[types.ChangelogEntry.fields.packages.item]
type = "string"

# description required when user_facing == true
[[types.ChangelogEntry.constraints]]
form = "conditional-required"
field = "description"
when = { field = "user_facing", predicate = "equals", value = true }

# type required when user_facing == true
[[types.ChangelogEntry.constraints]]
form = "conditional-required"
field = "type"
when = { field = "user_facing", predicate = "equals", value = true }
