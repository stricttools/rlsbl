# strictspec schema for a releasable's release file and its archives:
# .strictmetadata/releases/<releasable>/unreleased.toml while it is editable,
# and .strictmetadata/releases/<releasable>/v<version>.toml once archived. The
# version an archive records is its file name and is not repeated inside.
#
# The generated Go validator (internal/releaserecord/releasefilespec) is what
# the release record runs first. internal/releaserecord then decodes the
# document strictly and applies what this schema cannot see: a description of
# only whitespace, a flow-owned field in the editable file, and an archive in
# none of the three fates.
#
# THE THREE FATES. An archive is in one of three states, and every reader
# dispatches on which:
#
#   recorded         release_commit + [released_trees] -- it shipped, from a known commit
#   unrecoverable    unrecoverable = true              -- it shipped, from a commit nothing can name
#   never released   never_released = true             -- the version number exists, no release does
#
# The schema refuses a document carrying two of them; an archive carrying none
# is refused by the reader, because the same schema validates the editable
# unreleased.toml, which carries none by design. Exclusion is judged on
# presence, not on the value: rlsbl writes a marker only when it is true, so
# `unrecoverable = false` beside a release commit is a hand-made document and
# is refused all the same.
#
# The pre-release channel and blog-on-release are gone: `preid` and `blog` are
# unknown keys and `prerelease` is not a bump.

name = "rlsbl-release-file"
meta_version = 1
format_version = 2
document_syntax = "toml"
role = "schema"
root = "ReleaseFile"
description = "A releasable's release file: the bump, the target selection, and the release prose, plus the fate an archive records."

[types.ReleaseFile]
type = "record"

[types.ReleaseFile.fields.format_version]
type = "literal"
value = 2
required = true
description = "The document's format version."

[types.ReleaseFile.fields.bump]
type = "enum"
required = true
values = ["patch", "minor", "major", "infra"]
description = "How the release moves the version. An infra release moves it as a patch release does and is recorded as infra."

[types.ReleaseFile.fields.include]
type = "array"
required = true
description = "The target names to release. May be empty; disjoint from exclude."
[types.ReleaseFile.fields.include.item]
type = "string"
non_empty = true

[types.ReleaseFile.fields.exclude]
type = "array"
required = true
description = "The target names to skip. Disjoint from include."
[types.ReleaseFile.fields.exclude.item]
type = "string"
non_empty = true

[types.ReleaseFile.fields.description]
type = "string"
required = true
non_empty = true
description = "A short summary of the release. A description of only whitespace is refused by the reader."

[types.ReleaseFile.fields.context]
type = "string"
required = false
description = "Optional prose explaining why the changes were made."

[types.ReleaseFile.fields.release_commit]
type = "GitObjectHash"
required = false
description = "The commit this version shipped from: the release candidate whose CI concluded green, which the version tag points at. Written by the release flow at its archive step and by the history rewrites that move it; never authored by hand, and refused in the editable unreleased.toml. The rlsbl-ci-sha marker in the GitHub Release body restates it for CI and never outranks it."

[types.ReleaseFile.fields.released_trees]
type = "map"
required = false
key_pattern = "^(\\.|[A-Za-z0-9._][A-Za-z0-9._/-]*)$"
description = "The released content: one git tree object per released path, keyed by the repository-relative path (\".\" for a whole standalone repository, one entry per member directory for a workspace releasable). Written with release_commit, at the same step and under the same rule."
[types.ReleaseFile.fields.released_trees.value]
type = "GitObjectHash"

[types.ReleaseFile.fields.unrecoverable]
type = "boolean"
required = false
description = "Written only as true, by the backfill: this version shipped, but the commit it shipped from cannot be recovered from any source. The version has consumers and its refs are real; only the record of where it came from is lost."

[types.ReleaseFile.fields.never_released]
type = "boolean"
required = false
description = "Written only as true: the version number exists, but no release was ever published under it (a version claimed and abandoned, or a stray tag's version). Every question about what the releasable released passes over it."

[types.ReleaseFile.fields.shipped_as]
type = "string"
required = false
non_empty = true
description = "The tag this version shipped under, when it differs from the tag the releasable's format gives it today. Legal on a recorded and on an unrecoverable archive; refused on a never-released one, which shipped under nothing."

[types.ReleaseFile.fields.release_notices]
type = "array"
required = false
description = "The notices `rlsbl release deprecate` and `rlsbl release yank` put at the top of this version's GitHub Release, each the markdown block as it appears there, top to bottom. Every Release body rlsbl composes for the version carries them."
[types.ReleaseFile.fields.release_notices.item]
type = "string"
non_empty = true

[[types.ReleaseFile.constraints]]
form = "collections-disjoint"
left = "include"
right = "exclude"
normalization = "none"
description = "No target appears in both include and exclude."

[[types.ReleaseFile.constraints]]
form = "mutual-exclusion"
fields = ["release_commit", "unrecoverable", "never_released"]
description = "A version has one fate: recorded, unrecoverable, or never released."

[[types.ReleaseFile.constraints]]
form = "forbidden-when"
field = "released_trees"
when = { field = "unrecoverable", predicate = "present" }
description = "An unrecoverable version has no released trees to record."

[[types.ReleaseFile.constraints]]
form = "forbidden-when"
field = "released_trees"
when = { field = "never_released", predicate = "present" }
description = "A version that was never released released no trees."

[[types.ReleaseFile.constraints]]
form = "forbidden-when"
field = "shipped_as"
when = { field = "never_released", predicate = "present" }
description = "A never-released version shipped under no tag."

[types.GitObjectHash]
type = "string"
regex = "^[0-9a-f]{7,64}$"
description = "A git object id, commit or tree: full (40 hexadecimal digits, or 64 in a SHA-256 repository) or abbreviated to at least 7. The release flow records the full form; whether the object exists is checked by rlsbl, not here."
