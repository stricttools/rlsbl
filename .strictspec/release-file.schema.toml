# strictspec schema for the rlsbl release file (.rlsbl/releases/unreleased.toml
# while it is editable, .rlsbl/releases/v{X.Y.Z}.toml once archived).
# Source of truth: rlsbl/release_file.py (ReleaseConfig, _validate_release_config).
# This validates the raw DOCUMENT SHAPE at read time; rlsbl keeps a small set of
# consumer-native refinements (whitespace-only description, the flutter
# required-mode gate) as native checks -- see rlsbl/release_file.py.
#
# AUTHORITY. The archived release file is the authoritative record of WHICH
# COMMIT AND TREE a version shipped from: the `candidate_sha` and `tree_hashes`
# release commit fields are written by the release flow at the archive step, from the
# commit its own CI verified, and rlsbl rewrites that archive only through its
# own documented unlock paths. (Its local file mode is hygiene, not the
# guarantee: git records no read-only bit, so a fresh clone's archives are
# writable.)
# The `<!-- rlsbl-ci-sha: ... -->` marker in the GitHub Release body is a
# PROJECTION of `candidate_sha` for CI's publish check to parse -- it restates
# the release commit for a consumer that cannot read the repository, and it never
# outranks it. When the two disagree, the archive is right and the Release body
# is stale.
#
# The release commit fields are optional in the SHAPE because they only exist once the
# flow has authored them: the editable pre-release file never carries them (a
# hand-authored release commit is refused natively at release validation, see
# rlsbl/commands/release/validate.py), and archives written before release-commit recording
# existed carry neither.
#
# THE VERSION-FATE MODEL. An ARCHIVE is in exactly one of three states, and
# every reader dispatches on which:
#
#   recorded         candidate_sha + tree_hashes -- it shipped, from a known commit
#   unrecoverable    unrecoverable = true        -- it shipped, from a commit nothing can name
#   never_released   never_released = true       -- the version NUMBER exists, no release does
#
# The schema enforces the EXCLUSION half of that rule (no document carries two
# states) and leaves the "exactly one" half to the archive readers, because the
# same schema also validates the EDITABLE unreleased.toml, whose correct state
# is none of the three. `rlsbl.release_record.read_entry` is where an archive in
# none of them is a hard error.
#
# Exclusion is judged on PRESENCE, not on the value: rlsbl writes a marker only
# when it is true (see write_archived_release_file), so `unrecoverable = false`
# beside a candidate_sha is a hand-authored document rather than a state rlsbl
# produced, and the same refusal covers it.

name = "rlsbl-release-file"
meta_version = 1
format_version = 1
document_syntax = "toml"
role = "schema"
root = "ReleaseConfig"
targets = ["python"]
description = "A single-project rlsbl release descriptor: bump type, target selection, and release prose."

[types.ReleaseConfig]
type = "record"

[types.ReleaseConfig.fields.bump]
type = "enum"
required = true
values = ["patch", "minor", "major", "infra", "prerelease"]
description = "Version bump type (VALID_BUMP_TYPES)."

[types.ReleaseConfig.fields.include]
type = "array"
required = true
description = "Target names to release. May be empty; disjoint from exclude."
[types.ReleaseConfig.fields.include.item]
type = "string"

[types.ReleaseConfig.fields.exclude]
type = "array"
required = true
description = "Target names to skip. Disjoint from include."
[types.ReleaseConfig.fields.exclude.item]
type = "string"

[types.ReleaseConfig.fields.targets]
type = "map"
required = false
key_pattern = "^[a-z][a-z0-9-]*$"
description = "Per-target configuration, keyed by target name. Each key must appear in include."
[types.ReleaseConfig.fields.targets.value]
type = "TargetConfig"

[types.ReleaseConfig.fields.description]
type = "string"
required = true
non_empty = true
description = "Short summary of the release. Whitespace-only is additionally rejected natively."

[types.ReleaseConfig.fields.context]
type = "string"
required = false
description = "Optional multiline prose explaining why the changes were made."

[types.ReleaseConfig.fields.preid]
type = "string"
required = false
description = "Pre-release identifier. strictspec owns only its string type; membership in VALID_PREIDS, the empty-string-means-unset semantics, and the infra/stable couplings are consumer-native (rlsbl treats preid = \"\" and whitespace as unset, which an enum cannot express)."

[types.ReleaseConfig.fields.blog]
type = "boolean"
required = false
description = "Whether to generate a blog post for this release."

[types.ReleaseConfig.fields.candidate_sha]
type = "GitObjectHash"
required = false
description = "AUTHORITATIVE: the commit this version shipped from -- the release candidate whose CI concluded green, which is also the commit the version tag points at. Written by the release flow into the archived v{X.Y.Z}.toml at the archive step; never authored by hand, and absent from the editable unreleased.toml (release validation refuses one that carries it). The rlsbl-ci-sha marker in the GitHub Release body is this field's projection for CI to parse, not a second source."

[types.ReleaseConfig.fields.tree_hashes]
type = "map"
required = false
key_pattern = "^(\\.|[A-Za-z0-9._][A-Za-z0-9._/-]*)$"
description = "AUTHORITATIVE: the released content, one git tree object per released path, keyed by the repo-relative path (\".\" for a whole standalone repository). A standalone release has the single \".\" entry carrying the root tree of candidate_sha; a workspace releasable has one entry per member directory, because no single git object covers a set of member subtrees -- a per-member table is therefore the honest representation rather than a synthesized hash. Written by the release flow alongside candidate_sha, at the same archive step and under the same rule: rlsbl rewrites the archive only through its own documented unlock paths."
[types.ReleaseConfig.fields.tree_hashes.value]
type = "GitObjectHash"

[types.ReleaseConfig.fields.unrecoverable]
type = "boolean"
required = false
description = "A PERMANENT RECORD OF FAILED RECOVERY, written only by the backfill pass and only when set to true: this version SHIPPED, but the commit it shipped from could not be recovered from any source -- no tag under any recognized scheme (v{X.Y.Z}, name@v{X.Y.Z}, path/v{X.Y.Z}) and no version-bump commit in history. It is the alternative to silently leaving an archive with no release commit. The release flow never writes it (a flow that is releasing knows its own candidate), and it is stripped along with the release commit when `release undo` restores an archive as the editable unreleased.toml. Distinct from never_released: this version HAS consumers, its refs are real, and only rlsbl's knowledge of where it came from is lost."

[types.ReleaseConfig.fields.never_released]
type = "boolean"
required = false
description = "THE VERSION NUMBER EXISTS BUT NO RELEASE DOES, written only when set to true: a phantom tag's version, or a version claimed and abandoned. It is not a failed recovery -- there is nothing to recover, because nothing was ever published under this number. Every read that asks what this project RELEASED skips such a version: it is not the latest release, it does not bound the unreleased range, `release undo` does not select it, its refs are never demanded as missing, and `release reconcile` never plans a deletion of a tag that happens to carry its name. Its changelog section is still rendered -- a phantom version can have finalized changelog files, and hiding them would lose the record -- annotated as never released."

[types.ReleaseConfig.fields.shipped_as]
type = "string"
required = false
non_empty = true
description = "The historical tag spelling this version ACTUALLY shipped under, when it differs from the tag scheme in effect today (e.g. \"strictcli@v0.12.0\" on a version now tagged \"v0.12.0\", or \"auth-gateway/v0.1.0\" on one absorbed under a workspace scheme). One string per archive: a version shipped once, under one name. Orthogonal to the three fate states -- legal on a recorded and on an unrecoverable archive, refused on a never-released one, which shipped under nothing."

# NOTE: the preid couplings (preid == "stable" requires bump == "prerelease";
# bump == "infra" forbids preid) are consumer-native, not schema constraints:
# rlsbl treats preid = "" / whitespace as UNSET, so a present-but-empty preid
# must not trip forbidden-when. Enforced natively in _bind_release_config.

# Every key of targets must appear in include.
[[types.ReleaseConfig.constraints]]
form = "intra-document-references"
reference = "targets"
resolves_into = "include"
resolves_by = "map-key"
description = "A [targets.<name>] section is only valid when <name> is in include."

# include and exclude must be element-disjoint.
[[types.ReleaseConfig.constraints]]
form = "collections-disjoint"
left = "include"
right = "exclude"
normalization = "none"
description = "No element appears in both include and exclude."

# The version-fate states exclude one another. Zero present is the editable
# unreleased.toml and is legal here; an ARCHIVE with zero is refused by
# rlsbl.release_record.read_entry, which is the only reader that knows it is
# looking at an archive.
[[types.ReleaseConfig.constraints]]
form = "mutual-exclusion"
fields = ["candidate_sha", "unrecoverable", "never_released"]
description = "A version has one fate: recorded, unrecoverable, or never released."

# tree_hashes is the other half of the release commit, so it is forbidden beside
# either marker even in a document that omits candidate_sha.
[[types.ReleaseConfig.constraints]]
form = "forbidden-when"
field = "tree_hashes"
when = { field = "unrecoverable", predicate = "present" }
description = "An unrecoverable version has no released trees to record."

[[types.ReleaseConfig.constraints]]
form = "forbidden-when"
field = "tree_hashes"
when = { field = "never_released", predicate = "present" }
description = "A version that was never released released no trees."

# A version that was never released shipped under no tag, so there is no
# historical spelling for it to have shipped under.
[[types.ReleaseConfig.constraints]]
form = "forbidden-when"
field = "shipped_as"
when = { field = "never_released", predicate = "present" }
description = "A never-released version shipped under nothing."

# GitObjectHash -- a git object name, commit or tree. Same shape as the transition record
# schema's GitSha, and for the same reason.
[types.GitObjectHash]
type = "string"
regex = "^[0-9a-f]{7,40}$"
description = "A git object hash, commit or tree, abbreviated (>= 7) or full (40). The release flow records whatever `git rev-parse` answered, which is the full form; the shorter bound exists so a record made from an abbreviation is readable rather than rejected. Resolution against the object database is rlsbl-native, not a shape check."

# TargetConfig -- per-target overrides (only mode is recognized today).
[types.TargetConfig]
type = "record"
[types.TargetConfig.fields.mode]
type = "enum"
required = false
values = ["ota", "build"]
description = "Flutter delivery mode (VALID_TARGET_MODES). The flutter required-mode gate is native."
