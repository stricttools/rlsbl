# strictspec schema for one rlsbl JSONL changelog line.
# Source of truth: rlsbl/changelog/schema.py (ChangelogEntry, validate_schema).
# One document = one JSONL line.
#
# SCOPE: strictspec owns the raw DOCUMENT SHAPE (the per-line format_version
# gate, field types, the type/release_type enums, required fields, unknown-key
# rejection, and the user_facing conditional-required couplings). rlsbl keeps
# everything strictspec cannot see as native checks: hash resolution, tag
# ranges, commit coverage vs git, batch limits, and cross-file rules. The
# stream-level set-coverage constraint is DELIBERATELY NOT declared here -- it is
# rlsbl-native (coverage vs git).

name = "rlsbl-changelog-entry-commit"
meta_version = 1
format_version = 1
document_syntax = "jsonl"
role = "schema"
root = "ChangelogEntry"
targets = ["python"]
description = "One JSONL changelog line: commits required, id optional."

[types.ChangelogEntry]
type = "record"

[types.ChangelogEntry.fields.format_version]
type = "integer"
required = true
description = "Per-line format_version (JSONL per-line gate). Stamped into pre-versioning entries by the one-time bootstrap conversion script."

[types.ChangelogEntry.fields.commits]
type = "array"
required = true
min_len = 1
description = "Commit hashes. REQUIRED and non-empty (validate_schema: \"commits is empty\")."
[types.ChangelogEntry.fields.commits.item]
type = "string"

[types.ChangelogEntry.fields.user_facing]
type = "boolean"
required = true
description = "Whether this entry appears in the published changelog."

[types.ChangelogEntry.fields.description]
type = "string"
required = false
non_empty = true
description = "Markdown one-liner. REQUIRED WHEN user_facing == true (see constraint)."

[types.ChangelogEntry.fields.type]
type = "enum"
required = false
values = ["feature", "fix", "breaking"]
description = "Entry type. REQUIRED WHEN user_facing == true (see constraint)."

[types.ChangelogEntry.fields.release_type]
type = "enum"
required = false
values = ["ota", "build"]
description = "Flutter target release channel. Optional, unconstrained by user_facing."

[types.ChangelogEntry.fields.id]
type = "string"
required = false
description = "Stable ULID-style identifier. OPTIONAL (present on newer entries, absent on historical ones)."

[types.ChangelogEntry.fields.packages]
type = "array"
required = false
[types.ChangelogEntry.fields.packages.item]
type = "string"

# description required when user_facing == true
[[types.ChangelogEntry.constraints]]
form = "conditional-required"
field = "description"
when = { field = "user_facing", predicate = "equals", value = true }

# type required when user_facing == true
[[types.ChangelogEntry.constraints]]
form = "conditional-required"
field = "type"
when = { field = "user_facing", predicate = "equals", value = true }
