name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Per-SHA group: re-runs of the same commit dedupe, but a new commit never
# cancels an earlier commit's in-flight run (release CI conclusions stay intact).
concurrency:
  group: ${{ github.workflow_ref }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # requires-python: >= 3.11
        python-version: ["3.12", "3.13", "3.14"]
    # Pin the interpreter for every uv step (outer cache-warm + in-sandbox sync)
    # so the matrix version is what actually runs the suite.
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      # Pin a Go >= safegit's go.mod floor (currently go 1.25.7). scripts/test.sh
      # runs with GOTOOLCHAIN=local (no toolchain auto-download), so the runner's
      # OWN Go must already satisfy that floor -- otherwise the offline
      # in-sandbox safegit build cannot fetch a newer toolchain and every
      # Go-touching test fails. This installs Go into the hosted tool cache and
      # puts it on PATH; scripts/test.sh resolves GOROOT dynamically and binds
      # THIS toolchain into the sandbox (not the runner's older preinstalled Go).
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.12'
      - run: uv python install ${{ matrix.python-version }}
      # Warms the uv cache (network) so the in-sandbox offline `uv sync` succeeds.
      - run: uv sync --locked
      - run: uv run python -c "import rlsbl"
      - name: Install gitleaks
        run: |
          GITLEAKS_VERSION=8.24.3
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar xz -C /usr/local/bin gitleaks
      # Layer 3: run the suite inside the same bwrap sandbox as local dev
      # (scripts/test.sh) -- repo read-only, throwaway writable copy, no network.
      #
      # We build bubblewrap from a pinned source tag instead of installing the
      # apt package, for two reasons specific to Ubuntu 24.04 runners:
      #   1. The apt package is bubblewrap 0.9.x, which cannot configure the
      #      loopback interface under --unshare-net: it fails with
      #      "bwrap: loopback: Failed RTM_NEWADDR: Operation not permitted".
      #      That netlink/loopback path was fixed in 0.10+; 0.11.0 works.
      #   2. Ubuntu 24.04 restricts unprivileged user namespaces to AppArmor-
      #      profiled binaries (kernel.apparmor_restrict_unprivileged_userns=1).
      #      The apt package ships a profile; a source-built /usr/local/bin/bwrap
      #      would not, so it would be denied the userns it needs. Runners have
      #      passwordless sudo, so we relax that sysctl to allow unprivileged
      #      userns for our source-built binary.
      - name: Build bubblewrap 0.11.0 from source
        run: |
          set -euo pipefail
          # Allow unprivileged user namespaces for the source-built bwrap (no
          # AppArmor profile) -- see step comment above.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo apt-get update
          sudo apt-get install -y meson ninja-build libcap-dev
          git clone --depth 1 --branch v0.11.0 \
            https://github.com/containers/bubblewrap /tmp/bubblewrap-src
          # -Dtests=false / -Dman=disabled keep the build to the bwrap binary
          # only, so no docbook/xsltproc build deps are needed.
          meson setup /tmp/bubblewrap-build /tmp/bubblewrap-src \
            --prefix=/usr/local -Dtests=false -Dman=disabled
          meson compile -C /tmp/bubblewrap-build
          sudo meson install -C /tmp/bubblewrap-build
          bwrap --version
      - name: Run tests in the bwrap sandbox
        run: scripts/test.sh
