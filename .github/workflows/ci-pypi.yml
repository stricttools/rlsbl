name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Per-SHA group: re-runs of the same commit dedupe, but a new commit never
# cancels an earlier commit's in-flight run (release CI conclusions stay intact).
concurrency:
  group: ${{ github.workflow_ref }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # requires-python: >= 3.11
        python-version: ["3.12", "3.13", "3.14"]
    # Pin the interpreter for every uv step (outer cache-warm + in-sandbox sync)
    # so the matrix version is what actually runs the suite.
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v6
        with:
          # Don't leave the authenticated token in .git/config. The suite runs
          # git operations inside a throwaway copy of the tree; a persisted
          # credential is a needless secret in the working copy (defense in
          # depth regardless of the sandbox's --unshare-net).
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          # Pin uv (was unpinned-latest -- the least-controlled CI input). Keep
          # in lockstep with the dev-box uv (`uv --version`). Bump deliberately.
          version: "0.9.17"
      # Install the Go declared in .go-version: the same Go as local development,
      # declared once for this repository (rlsbl has no go.mod of its own).
      # It must stay >= safegit's go.mod floor. scripts/test.sh runs with
      # GOTOOLCHAIN=local (no toolchain auto-download), so the runner's OWN Go
      # must already satisfy that floor -- otherwise the offline in-sandbox
      # safegit build cannot fetch a newer toolchain and every Go-touching test
      # fails. It must also be on the release line stamped in
      # rlsbl/data/go-stdlib-packages.json, or the table's freshness test skips.
      # This installs Go into the hosted tool cache and puts it on PATH;
      # scripts/test.sh resolves GOROOT dynamically and binds THIS toolchain
      # into the sandbox (not the runner's older preinstalled Go).
      - uses: actions/setup-go@v6
        with:
          go-version-file: .go-version
      - run: uv python install ${{ matrix.python-version }}
      # Warms the uv cache (network) so the in-sandbox offline `uv sync` succeeds.
      - run: uv sync --locked
      - run: uv run python -c "import rlsbl"
      # Listing what the upload carries takes building it, which needs the
      # network, so the upload is built and checked here, on the candidate
      # commit a release waits on, rather than before the release starts.
      - name: Build the upload
        run: uv build --out-dir "$RUNNER_TEMP/rlsbl-upload"
      # A registry keeps every upload permanently: planning notes, release
      # metadata, agent instructions, scratch output, and environment files
      # are refused. The program is rlsbl's own private-path rule.
      - name: Check the upload carries no private paths
        run: |
          cat > "$RUNNER_TEMP/privatepathscheck.go" <<'GO'
          // Code generated by internal/targets/gen from internal/targets/privatepaths.go and internal/targets/privatepathscheck.go.in; DO NOT EDIT.

          // Command privatepathscheck refuses every private path in the Python
          // artifacts built into the directory it is given. The pypi CI workflow runs
          // it from the package directory, after `uv build --out-dir <dir>`:
          //
          //	go run privatepathscheck.go <dir>
          //
          // It prints one ::error:: line per private path an sdist or wheel would
          // ship, and exits 1 when there is any.
          package main

          import (
          	"archive/tar"
          	"archive/zip"
          	"bufio"
          	"compress/gzip"
          	"errors"
          	"fmt"
          	"io"
          	"os"
          	"path"
          	"path/filepath"
          	"strings"
          )

          func main() { os.Exit(run(os.Args[1:])) }

          func run(args []string) int {
          	if len(args) != 1 {
          		fmt.Fprintln(os.Stderr, "usage: go run privatepathscheck.go <directory the upload was built into>")
          		return 2
          	}
          	backend, err := buildBackend("pyproject.toml")
          	if err != nil {
          		fmt.Fprintln(os.Stderr, err)
          		return 2
          	}
          	entries, err := os.ReadDir(args[0])
          	if err != nil {
          		fmt.Fprintln(os.Stderr, err)
          		return 2
          	}
          	var refused []string
          	for _, e := range entries {
          		part := ""
          		switch {
          		case strings.HasSuffix(e.Name(), ".tar.gz"):
          			part = "sdist"
          		case strings.HasSuffix(e.Name(), ".whl"):
          			part = "wheel"
          		default:
          			continue
          		}
          		paths, err := archivePaths(filepath.Join(args[0], e.Name()))
          		if err != nil {
          			fmt.Fprintln(os.Stderr, err)
          			return 2
          		}
          		for _, p := range PrivatePathsIn(paths) {
          			refused = append(refused, fmt.Sprintf("%s would ship %s, a private path (%s): %s", e.Name(), p.Rel, p.Rule, PythonFix(backend, part, p.Rel, p.Rule, p.Directory)))
          		}
          	}
          	for _, line := range refused {
          		fmt.Println("::error::" + line)
          	}
          	if len(refused) > 0 {
          		fmt.Printf("%d private path(s) in the upload; a registry keeps every upload permanently, so this release is refused until each is excluded\n", len(refused))
          		return 1
          	}
          	fmt.Println("the upload carries no private paths")
          	return 0
          }

          // archivePaths are the package-relative files an artifact carries: a wheel
          // from its install root without its .dist-info metadata, an sdist below its
          // one top-level directory.
          func archivePaths(file string) ([]string, error) {
          	var out []string
          	if strings.HasSuffix(file, ".whl") {
          		r, err := zip.OpenReader(file)
          		if err != nil {
          			return nil, err
          		}
          		defer r.Close()
          		for _, f := range r.File {
          			if !strings.HasSuffix(f.Name, "/") && !strings.Contains(f.Name, ".dist-info/") {
          				out = append(out, f.Name)
          			}
          		}
          		return out, nil
          	}
          	handle, err := os.Open(file)
          	if err != nil {
          		return nil, err
          	}
          	defer handle.Close()
          	gz, err := gzip.NewReader(handle)
          	if err != nil {
          		return nil, fmt.Errorf("%s: %w", file, err)
          	}
          	tr := tar.NewReader(gz)
          	for {
          		h, err := tr.Next()
          		if errors.Is(err, io.EOF) {
          			return out, nil
          		}
          		if err != nil {
          			return nil, fmt.Errorf("%s: %w", file, err)
          		}
          		if _, rel, ok := strings.Cut(h.Name, "/"); ok && h.Typeflag == tar.TypeReg && rel != "" {
          			out = append(out, rel)
          		}
          	}
          }

          // buildBackend is [build-system] build-backend of the pyproject.toml at
          // path, or "" when it declares none. The standard library has no TOML
          // reader, so this reads the key's plain one-line spelling, the one uv and
          // rlsbl write; it names the backend only to word each refusal's fix.
          func buildBackend(path string) (string, error) {
          	f, err := os.Open(path)
          	if err != nil {
          		return "", err
          	}
          	defer f.Close()
          	section := ""
          	sc := bufio.NewScanner(f)
          	for sc.Scan() {
          		line := strings.TrimSpace(sc.Text())
          		if strings.HasPrefix(line, "[") {
          			section = strings.TrimSpace(strings.Trim(line, "[]"))
          			continue
          		}
          		key, value, ok := strings.Cut(line, "=")
          		if !ok || section != "build-system" || strings.TrimSpace(key) != "build-backend" {
          			continue
          		}
          		value = strings.TrimSpace(value)
          		if len(value) >= 2 && (value[0] == '"' || value[0] == '\'') {
          			if end := strings.IndexByte(value[1:], value[0]); end >= 0 {
          				return value[1 : end+1], nil
          			}
          		}
          	}
          	return "", sc.Err()
          }

          // The paths a published upload must never carry. A package directory holds
          // the project's working state beside its product: planning notes, release
          // metadata, agent instructions, scratch output, and secrets. A registry
          // keeps what it is sent permanently, so an upload carrying any of them is
          // refused before it is published. npm packages and Go module zips are
          // listed offline and refused before a release changes anything; a Python
          // upload can only be listed by building it, which needs the network, so the
          // pypi CI workflow builds it on the candidate commit and runs a standalone
          // program over the result. That program is generated from this file's text
          // (internal/targets/gen), which is why this file imports only the standard
          // library and nothing of rlsbl: the rules rlsbl applies and the rules CI
          // applies are one text.
          //
          // Paths are relative to the package directory: the root of an sdist or npm
          // tarball below its top-level directory, the root of a Go module zip below
          // module@version/, or a wheel's install root.

          // PrivateRootDirs are private only at the package directory's root: the
          // same name deeper in may be ordinary source (a todo package, a test's
          // screenshots fixture). stricttools/ is the family's earlier metadata root.
          var PrivateRootDirs = []string{"todo", "experiments", "screenshots", "stricttools"}

          // PrivateDirs are private at any depth: release state, the family's metadata
          // roots, and tool and agent state.
          var PrivateDirs = []string{".rlsbl", ".rlsbl-monorepo", ".strictmetadata", ".stricttools", ".claude", ".selfdoc", ".strictcli"}

          // PrivateFiles are agent instruction files, private at any depth.
          var PrivateFiles = []string{"CLAUDE.md", "AGENTS.md"}

          // PrivateNamePatterns are private at any depth, for a file or a directory
          // alike: environment files, and anything named local-only.
          var PrivateNamePatterns = []string{".env*", "*.local-only"}

          // FixtureDir holds test fixtures, never the project's own state (Go's
          // testdata convention): a fixture may hold any private name as a test's
          // input or expected output.
          const FixtureDir = "testdata"

          // ExcludeEntries are every rule as a gitignore-syntax exclude entry, in
          // declaration order; a refusal names its rule in this spelling.
          func ExcludeEntries() []string {
          	var out []string
          	for _, d := range PrivateRootDirs {
          		out = append(out, "/"+d+"/")
          	}
          	for _, d := range PrivateDirs {
          		out = append(out, d+"/")
          	}
          	out = append(out, PrivateFiles...)
          	return append(out, PrivateNamePatterns...)
          }

          // PrivateMatch is why the package-relative path rel is private: its rule (an
          // exclude entry) and the private directory holding it, relative to the
          // package directory ("" when the path is a private file itself). The
          // outermost private component wins, so a whole private directory is one
          // rule however deep its files sit, and nothing under a testdata directory is
          // private. found is false for a path that is not private.
          func PrivateMatch(rel string) (rule, directory string, found bool) {
          	var parts []string
          	for _, p := range strings.Split(strings.ReplaceAll(rel, "\\", "/"), "/") {
          		if p != "" && p != "." {
          			parts = append(parts, p)
          		}
          	}
          	last := len(parts) - 1
          	for _, p := range parts[:max(last, 0)] {
          		if p == FixtureDir {
          			return "", "", false
          		}
          	}
          	for i, part := range parts {
          		isDir := i < last
          		dir := ""
          		if isDir {
          			dir = strings.Join(parts[:i+1], "/")
          		}
          		if isDir && i == 0 && contains(PrivateRootDirs, part) {
          			return "/" + part + "/", dir, true
          		}
          		if isDir && contains(PrivateDirs, part) {
          			return part + "/", dir, true
          		}
          		if !isDir && contains(PrivateFiles, part) {
          			return part, "", true
          		}
          		for _, pattern := range PrivateNamePatterns {
          			if ok, _ := path.Match(pattern, part); ok {
          				return pattern, dir, true
          			}
          		}
          	}
          	return "", "", false
          }

          func contains(list []string, s string) bool {
          	for _, item := range list {
          		if item == s {
          			return true
          		}
          	}
          	return false
          }

          // PrivatePath is one private path an upload would carry.
          type PrivatePath struct {
          	Rel       string
          	Rule      string
          	Directory string
          }

          // PrivatePathsIn are the private paths among paths, in their order.
          func PrivatePathsIn(paths []string) []PrivatePath {
          	var found []PrivatePath
          	for _, rel := range paths {
          		if rule, dir, ok := PrivateMatch(rel); ok {
          			found = append(found, PrivatePath{Rel: rel, Rule: rule, Directory: dir})
          		}
          	}
          	return found
          }

          // PythonFix says how to keep rel out of a Python upload of the given part
          // ("sdist" or "wheel"), in the spelling of the build backend that builds it.
          func PythonFix(backend, part, rel, rule, directory string) string {
          	switch {
          	case strings.HasPrefix(backend, "hatchling"):
          		return "add \"" + rule + "\" to exclude under [tool.hatch.build.targets." + part + "] in pyproject.toml"
          	case strings.HasPrefix(backend, "uv_build"):
          		key := "wheel-exclude"
          		if part == "sdist" {
          			key = "source-exclude"
          		}
          		return "add \"" + rule + "\" to " + key + " under [tool.uv.build-backend] in pyproject.toml"
          	case strings.HasPrefix(backend, "setuptools"):
          		if part == "wheel" {
          			what := rel
          			if directory != "" {
          				what = directory
          			}
          			return "leave " + what + " out of the packages and package data under [tool.setuptools] in pyproject.toml"
          		}
          		line := "exclude " + rel
          		if directory != "" {
          			line = "prune " + directory
          		}
          		return "add \"" + line + "\" to MANIFEST.in"
          	}
          	shown := backend
          	if shown == "" {
          		shown = "the default build backend"
          	}
          	return "exclude " + rule + " from the " + part + " in the configuration of " + shown
          }
          GO
          go run "$RUNNER_TEMP/privatepathscheck.go" "$RUNNER_TEMP/rlsbl-upload"
      # The pypi CI template dropped its own gitleaks install (the scan moved to
      # the publish workflow's build artifacts). rlsbl still needs the binary
      # HERE: its own suite shells out to gitleaks for the secret-scan tests, and
      # /usr/local/bin rides into the bwrap sandbox on the read-only /usr bind.
      - name: Install gitleaks
        run: |
          GITLEAKS_VERSION=8.24.3
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar xz -C /usr/local/bin gitleaks
      # git-filter-repo backs the monorepo extract/absorb flows. The apt package
      # installs the `git-filter-repo` command into /usr (inside the sandbox's
      # read-only /usr bind and on its PATH), so scripts/test.sh needs no change.
      # rlsbl shells out to the command and the tests skip on
      # shutil.which("git-filter-repo") -- so installing it here un-skips several
      # @skip_no_filter_repo classes on CI for the first time (extract/absorb/
      # migrate-releasable integration tests). That is desired coverage.
      - name: Install git-filter-repo
        run: sudo apt-get update && sudo apt-get install -y git-filter-repo
      # saferm backs the conversion flows' deletion-consent design: absorb's
      # residue sweep and extract's source-side deletion refuse without it
      # unless --delete-with-rm is passed, and the tests exercising the sweep
      # run with the real tool. Installed into /usr/local/bin so the sandbox's
      # read-only /usr bind sees it (~/go/bin is not bound). @v0 per the
      # internal-Go-tools convention -- never @latest.
      - name: Install saferm
        run: |
          go install github.com/stricttools/saferm@v0
          sudo cp "$(go env GOPATH)/bin/saferm" /usr/local/bin/saferm
      # Warm the uv cache for the FIXTURE projects' fresh, lockfile-less uv work.
      # The `uv sync --locked` above warms rlsbl's own wheels from the lockfile,
      # but a locked sync does NOT populate the simple-index METADATA buckets
      # (simple-v*) that a *fresh* resolution needs, nor the build-backend
      # packages a *fresh build* needs. Several tests drive the real release
      # flow against a throwaway fixture project that has no lockfile, doing two
      # things uv must satisfy from scratch (and, in the sandbox, offline):
      #
      #   1. Built-in test step: `uv run python -m pytest` -> a fresh resolve of
      #      the fixture's dev group. Needs pytest metadata+wheels for the EXACT
      #      version the fixture asks for -- it pins `pytest=={pytest.__version__}`,
      #      i.e. rlsbl's own locked pytest. An unpinned warm here caches whatever
      #      the index calls newest instead, and the day that moves past the
      #      locked version the fixture's pin is the one thing the offline cache
      #      cannot serve ("Because pytest==X needs to be downloaded from a
      #      registry ..."), taking the job red. So the pin is READ from the
      #      running pytest, the same expression the fixture pins with.
      #   2. Build step: `uv build --out-dir dist` (rlsbl/pipelines/build.py).
      #      The fixtures declare NO [build-system], so uv uses the PEP 517
      #      default backend and resolves `setuptools>=40.8.0` + wheel for an
      #      isolated build env. rlsbl itself builds with hatchling, so the
      #      locked sync never warms setuptools/wheel -- a fresh offline build
      #      fails with `uv build ... exit 2` ("setuptools was not found").
      #
      # ONE throwaway project covers both: declare the fixture dep union AND omit
      # [build-system] (matching the fixtures) so `uv build` pulls the same
      # setuptools-fallback backend the fixtures need. Fixtures served:
      #   - tests/test_prerelease_integration.py (full-flow x2)
      #   - tests/test_release_hooks.py::TestHookCwdMonorepo (post-release cwd)
      # All three build via the setuptools fallback; the prerelease pair also
      # resolves pytest. Add a dep here when a NEW uv-running fixture declares
      # one NOT already in rlsbl's own tree (click/tomlkit/strictcli are rlsbl
      # runtime deps and already cached; only pytest is dev-only). A fixture that
      # declares its own [build-system] (e.g. hatchling) would need that backend
      # warmed here too.
      - name: Warm uv cache for fixture-project resolution and build
        run: |
          set -euo pipefail
          WARM="$(mktemp -d)"
          # The fixture's pin, read from the same place the fixture reads it.
          PYTEST_PIN="$(uv run python -c 'import pytest; print(pytest.__version__)')"
          echo "warming pytest==${PYTEST_PIN} (the fixture's pin)"
          # No [build-system] -> PEP 517 setuptools fallback, matching fixtures.
          cat > "${WARM}/pyproject.toml" <<EOF
          [project]
          name = "rlsbl-fixture-cache-warm"
          version = "0.0.0"
          requires-python = ">=3.11"

          [dependency-groups]
          dev = ["pytest==${PYTEST_PIN}"]
          EOF
          # A trivial package so setuptools auto-discovery has something to build.
          mkdir -p "${WARM}/rlsbl_fixture_cache_warm"
          : > "${WARM}/rlsbl_fixture_cache_warm/__init__.py"
          # Warm pytest metadata+wheels (fresh resolve).
          uv lock --directory "${WARM}"
          uv sync --directory "${WARM}"
          # Warm the setuptools-fallback build backend (isolated build env).
          uv build --directory "${WARM}" --out-dir "${WARM}/dist"
      # Layer 3: run the suite inside the same bwrap sandbox as local dev
      # (scripts/test.sh) -- repo read-only, throwaway writable copy, no network.
      #
      # We build bubblewrap from a pinned source tag instead of installing the
      # apt package, for two reasons specific to Ubuntu 24.04 runners:
      #   1. The apt package is bubblewrap 0.9.x, which cannot configure the
      #      loopback interface under --unshare-net: it fails with
      #      "bwrap: loopback: Failed RTM_NEWADDR: Operation not permitted".
      #      That netlink/loopback path was fixed in 0.10+; 0.11.0 works.
      #   2. Ubuntu 24.04 restricts unprivileged user namespaces to AppArmor-
      #      profiled binaries (kernel.apparmor_restrict_unprivileged_userns=1).
      #      The apt package ships a profile; a source-built /usr/local/bin/bwrap
      #      would not, so it would be denied the userns it needs. Runners have
      #      passwordless sudo, so we relax that sysctl to allow unprivileged
      #      userns for our source-built binary.
      - name: Build bubblewrap 0.11.0 from source
        run: |
          set -euo pipefail
          # Allow unprivileged user namespaces for the source-built bwrap (no
          # AppArmor profile) -- see step comment above.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo apt-get update
          sudo apt-get install -y meson ninja-build libcap-dev
          git clone --depth 1 --branch v0.11.0 \
            https://github.com/containers/bubblewrap /tmp/bubblewrap-src
          # -Dtests=false / -Dman=disabled keep the build to the bwrap binary
          # only, so no docbook/xsltproc build deps are needed.
          meson setup /tmp/bubblewrap-build /tmp/bubblewrap-src \
            --prefix=/usr/local -Dtests=false -Dman=disabled
          meson compile -C /tmp/bubblewrap-build
          sudo meson install -C /tmp/bubblewrap-build
          bwrap --version
      - name: Run tests in the bwrap sandbox
        run: scripts/test.sh
