# rlsbl's checks registry, read by strictcli's check framework and embedded
# by package checks. Every check is also an option, rlsbl:<check name>, which
# internal/options/gen renders into internal/options/registry.toml.
#
# pure means the check starts only programs the observe allowlist
# (internal/previewapply/allowlist.go) admits, or none: a pure check still
# runs under --dry-run. needs_network says whether the check needs the
# network to answer at all.
#
# A check without a scope answers for one releasable, and refuses at a
# workspace root, which names no releasable. A scope's tokens are interpreted
# by package checks before the check runs: repository (the check answers for
# the whole repository), workspace (it answers for the workspace, and skips
# in a standalone repository), non_dev_only, non_dev_node, library, and
# releasable (each narrows the members it sees), and push (it skips outside a
# push).
#
# Hooks name the selection a git hook or the release runs: the installed
# pre-push hook runs `rlsbl failing-checks --hook pre-push`, and the release's
# preflight runs the pre-release hook's selection.
app = "rlsbl"

[hooks.pre-push]
tag = "prepush"

[hooks.pre-release]
tag = "preflight"

[checks.branch-sync]
description = "The local branch is not behind its remote tracking branch (requires network)."
subject = "release"
tags = ["release"]
severity = "error"
fast = true
pure = false
needs_network = true
depends_on = []

