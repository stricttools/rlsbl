# rlsbl's options registry: every rlsbl check is an option, rlsbl:<check name>,
# validated by strictspec's built-in options-registry schema. Generated from
# internal/checks/checks.toml by `go run ./internal/options/gen`; never edit it
# by hand.

format_version = 2

[[option]]
name = "branch-sync"
subject = "release"
values = "error > warn > off"
default = "error"
scope = "none"
requires = []
description = "The local branch is not behind its remote tracking branch (requires network)."

[[option]]
name = "changelog-batch-commits"
subject = "changelog"
values = "error > warn > off"
default = "error"
scope = "none"
requires = []
description = "No changelog entry references more commits than the per-entry limit unless it carries a batch_reason."

[[option]]
name = "changelog-batch-entries"
subject = "changelog"
values = "error > warn > off"
default = "error"
scope = "none"
requires = []
description = "No commit appears in more changelog entries than the per-commit limit."

[[option]]
name = "changelog-coverage"
subject = "changelog"
values = "error > warn > off"
default = "error"
scope = "none"
requires = ["changelog-hashes"]
description = "Every unreleased commit appears in at least one JSONL changelog entry."

[[option]]
name = "changelog-entry"
subject = "changelog"
values = "error > warn > off"
default = "error"
scope = "none"
requires = ["version-consistency"]
description = "The releasable's generated CHANGELOG.md has a section for its current version."

[[option]]
name = "changelog-format-version"
subject = "changelog"
values = "error > warn > off"
default = "error"
scope = "none"
requires = []
description = "Every line of every changelog file carries the changelog format version rlsbl reads."

[[option]]
name = "changelog-hashes"
subject = "changelog"
values = "error > warn > off"
default = "error"
scope = "none"
requires = []
description = "Every commit hash in the JSONL changelog entries resolves in git."

[[option]]
name = "changelog-orphans"
subject = "changelog"
values = "error > warn > off"
default = "error"
scope = "none"
requires = []
description = "No changelog entry has every hash unresolvable, out of range, or owned by another releasable."

[[option]]
name = "changelog-range"
subject = "changelog"
values = "error > warn > off"
default = "error"
scope = "none"
requires = ["changelog-hashes"]
description = "Every resolved changelog hash falls within this checkout's unreleased commit range."

[[option]]
name = "changelog-schema"
subject = "changelog"
values = "error > warn > off"
default = "error"
scope = "none"
requires = []
description = "Every changelog entry passes schema validation: a user-facing entry carries a description and a type."

[[option]]
name = "changelog-user-facing"
subject = "changelog"
values = "warn > off"
default = "warn"
scope = "none"
requires = []
description = "At least one unreleased changelog entry is user-facing."

[[option]]
name = "ci-publish-secrets"
subject = "release"
values = "error > warn > off"
default = "error"
scope = "none"
requires = []
description = "Every Actions secret the configured CI publish pipelines authenticate with exists on the repository (requires network)."

[[option]]
name = "cli-test-coverage"
subject = "tests"
values = "error > warn > off"
default = "error"
scope = "none"
requires = []
description = "Every registered command path appears in the committed test-coverage manifest."

[[option]]
name = "confidential-names"
subject = "project"
values = "error > warn > off"
default = "error"
scope = "none"
requires = []
description = "In a public repository, no tracked file and no changelog entry contains a name from the machine-local confidential-name index."

[[option]]
name = "consequential-grant-agreement"
subject = "code"
values = "warn > off"
default = "warn"
scope = "none"
requires = []
description = "Every command declaring a grant that leaves the process also declares itself consequential."

[[option]]
name = "cross-repo-path-sources"
subject = "dependencies"
values = "error > warn > off"
default = "error"
scope = "none"
requires = []
description = "No [tool.uv.sources] path entry in the committed pyproject.toml resolves outside the repository."

[[option]]
name = "declarations-valid"
subject = "project"
values = "error > warn > off"
default = "error"
scope = "none"
requires = []
description = "The release declarations and the test runner's settings pass rlsbl's rules, every adoption declaration agrees with its option, and every deploy_command belongs to a proprietary releasable."

[[option]]
name = "dep-floors"
subject = "dependencies"
values = "error > warn > off"
default = "off"
scope = "path"
requires = ["declarations-valid"]
description = "Every ecosystem-internal dependency a member's internal_dep_floors names declares a >= floor at the version the lockfile resolves."

[[option]]
name = "dep-locks"
subject = "dependencies"
values = "error > warn > off"
default = "error"
scope = "none"
requires = []
description = "Every lockfile still resolves the manifest beside it."

[[option]]
name = "description-consistency"
subject = "project"
values = "warn > off"
default = "warn"
scope = "none"
requires = []
description = "Every detected target reports the same package description."

[[option]]
name = "dev-only-boundary"
subject = "workspace"
values = "error > warn > off"
default = "error"
scope = "none"
requires = []
description = "No member that is not dev-only has a runtime dependency on a dev-only member."

[[option]]
name = "dev-overlay-drift"
subject = "dependencies"
values = "error > warn > off"
default = "error"
scope = "none"
requires = []
description = "Every rlsbl dev sync overlay is still an editable install of its declared checkout."

[[option]]
name = "dunder-version-missing"
subject = "project"
values = "error > warn > off"
default = "error"
scope = "none"
requires = []
description = "A PyPI project that keeps a version constant in source names it __version__."

[[option]]
name = "ecosystem-tagging"
subject = "project"
values = "on > off"
default = "on"
scope = "none"
requires = []
description = "Whether rlsbl tags the project as part of the rlsbl ecosystem: the rlsbl keyword in package.json and pyproject.toml, and the rlsbl topic on its GitHub repository, which `rlsbl discover` searches."

[[option]]
name = "effects-bypass"
subject = "code"
values = "error > warn > off"
default = "error"
scope = "none"
requires = []
description = "No process, filesystem-mutation, or network call reachable from a command handler bypasses the effects handle."

[[option]]
name = "go-companion-tags"
subject = "workspace"
values = "error > warn > off"
default = "error"
scope = "none"
requires = []
description = "Every releasable's publishing Go members have companion tags for its latest released version."

[[option]]
name = "go-deprecation-published"
subject = "release"
values = "error > warn > off"
default = "error"
scope = "none"
requires = []
description = "Every closed go-module-path identity of the lifecycle-and-license record serves a Deprecated notice through the Go module proxy (requires network)."

[[option]]
name = "go-module-identity"
subject = "project"
values = "error > warn > off"
default = "error"
scope = "none"
requires = []
description = "Every go.mod's module path equals the repository's origin identity plus the module's subdirectory."

[[option]]
name = "go-module-major-suffix"
subject = "project"
values = "error > warn > off"
default = "error"
scope = "none"
requires = []
description = "No go.mod module path ends in a major-version suffix (/v2 and above)."

[[option]]
name = "go-toolchain-declared"
subject = "project"
values = "error > warn > off"
default = "error"
scope = "none"
requires = []
description = "Every Go module's go.mod carries a toolchain line."

[[option]]
name = "go-workspace-replace"
subject = "project"
values = "error > warn > off"
default = "error"
scope = "none"
requires = []
description = "No releasable Go member replaces a module with a directory in the workspace."

[[option]]
name = "go-workspace-require-current"
subject = "project"
values = "error > warn > off"
default = "error"
scope = "none"
requires = []
description = "No Go member requires a sibling workspace module below that module's latest release."

[[option]]
name = "ldflags-symbol"
subject = "code"
values = "error > warn > off"
default = "error"
scope = "none"
requires = []
description = "Every -X linker flag in the tracked build configuration names an injectable string variable the Go source declares."

[[option]]
name = "license-consistency"
subject = "project"
values = "warn > off"
default = "warn"
scope = "none"
requires = []
description = "Every detected target reports the same license, and it is the license the lifecycle-and-license record holds for the releasable today."

[[option]]
name = "license-file"
subject = "project"
values = "error > warn > off"
default = "error"
scope = "none"
requires = []
description = "A LICENSE file exists, is non-empty, and has no unreplaced template variables."

[[option]]
name = "lifecycle-record-valid"
subject = "project"
values = "error > warn > off"
default = "error"
scope = "none"
requires = []
description = "The lifecycle-and-license record exists, passes every rule the record alone is judged by, and keeps every closed period and held registry name the record at the nearest release commit holds."

[[option]]
name = "lock"
subject = "release"
values = "warn > off"
default = "warn"
scope = "none"
requires = []
description = "No release is left interrupted: no releasable has an in-progress release state while no rlsbl process holds the release lock."

[[option]]
name = "member-pytest-config"
subject = "tests"
values = "error > warn > off"
default = "error"
scope = "none"
requires = []
description = "When an enclosing member or the workspace root has a conftest.py, every member with a tests/ directory under it pins its own pytest rootdir."

[[option]]
name = "name-consistency"
subject = "project"
values = "warn > off"
default = "warn"
scope = "none"
requires = []
description = "Every detected target reports the same package name."

[[option]]
name = "nested-member-runner-exclusion"
subject = "tests"
values = "error > warn > off"
default = "error"
scope = "none"
requires = []
description = "Every member's test runner excludes the members nested inside it."

[[option]]
name = "nested-member-upload-contents"
subject = "project"
values = "error > warn > off"
default = "error"
scope = "none"
requires = []
description = "A member's npm package and Go module zip carry no nested member's files."

[[option]]
name = "nested-member-uv-sources"
subject = "project"
values = "error > warn > off"
default = "error"
scope = "none"
requires = []
description = "No member nested inside another member declares its own uv workspace sources."

[[option]]
name = "npm-private-mismatch"
subject = "project"
values = "error > warn > off"
default = "error"
scope = "none"
requires = []
description = "A package.json with private: true does not contradict publish_mode ci."

[[option]]
name = "npm-token-synced"
subject = "release"
values = "error > warn > off"
default = "error"
scope = "none"
requires = []
description = "The npm token in ~/.npmrc is accepted by npm, and the repository's NPM_TOKEN secret was set no earlier than that token was created (requires network)."

[[option]]
name = "observe-allowlist-breadth"
subject = "code"
values = "warn > off"
default = "warn"
scope = "none"
requires = []
description = "No proc_observe_allowlist prefix is a single token."

[[option]]
name = "old-repo-archived"
subject = "release"
values = "error > warn > off"
default = "error"
scope = "none"
requires = []
description = "Every repository a closed repository-url identity of the lifecycle-and-license record names is archived on GitHub (requires network)."

[[option]]
name = "path-tag-format-go-member"
subject = "workspace"
values = "error > warn > off"
default = "error"
scope = "none"
requires = []
description = "A releasable's path-style tag_format names the path of one of its own Go members."

[[option]]
name = "prepush-changelog-coverage"
subject = "push"
values = "error > warn > off"
default = "error"
scope = "none"
requires = []
description = "Every pushed commit has a JSONL changelog entry."

[[option]]
name = "prepush-gitignore-guard"
subject = "push"
values = "error > warn > off"
default = "error"
scope = "none"
requires = []
description = "No rlsbl-managed file is gitignored."

[[option]]
name = "prepush-manual-warning"
subject = "push"
values = "error > warn > off"
default = "error"
scope = "none"
requires = []
description = "No push to a release branch is made outside rlsbl release."

[[option]]
name = "private-repo-publishing"
subject = "release"
values = "error > warn > off"
default = "error"
scope = "none"
requires = []
description = "A confidential or private repository's release uses no publishing feature that records the repository's identity publicly: build attestations, the Go module proxy, a Go library, a Homebrew tap, or a manifest naming the repository (requires network)."

[[option]]
name = "publish-mode-workflow"
subject = "release"
values = "error > warn > off"
default = "error"
scope = "none"
requires = []
description = "A project with publish_mode none has no workflow that publishes to a public registry."

[[option]]
name = "releasable-residue"
subject = "workspace"
values = "error > warn > off"
default = "error"
scope = "none"
requires = []
description = "No old-layout rlsbl directory, member changelog, or release state of an undeclared subject is left behind; `rlsbl monorepo cleanup` removes it."

[[option]]
name = "repository-visibility"
subject = "release"
values = "error > warn > off"
default = "error"
scope = "none"
requires = []
description = "Whether the repository is confidential agrees with GitHub's visibility of it: confidential with private, public with public (requires network)."

[[option]]
name = "router-filters-fresh"
subject = "workspace"
values = "error > warn > off"
default = "error"
scope = "none"
requires = []
description = "The filters of the generated ci-router.yml match a fresh derivation from the workspace."

[[option]]
name = "scaffold-conflicts"
subject = "scaffold"
values = "error > warn > off"
default = "error"
scope = "none"
requires = []
description = "Scaffold-managed files carry no unresolved merge conflict markers."

[[option]]
name = "scaffold-gitignore-stale"
subject = "scaffold"
values = "warn > off"
default = "warn"
scope = "none"
requires = []
description = "Every workspace member's .gitignore holds every rlsbl-managed entry."

[[option]]
name = "scaffold-unreplaced-vars"
subject = "scaffold"
values = "error > warn > off"
default = "error"
scope = "none"
requires = []
description = "Committed scaffold files carry no unreplaced rlsbl template variables."

[[option]]
name = "selfdoc-version-drift"
subject = "project"
values = "error > warn > off"
default = "error"
scope = "none"
requires = []
description = "The version in selfdoc.json matches the version of the releasable the project is versioned under."

[[option]]
name = "stash-free"
subject = "release"
values = "error > warn > off"
default = "error"
scope = "none"
requires = []
description = "The repository carries no git stash."

[[option]]
name = "strictcode"
subject = "code"
values = "error > warn > off"
default = "error"
scope = "none"
requires = []
description = "strictcode implements every rule rlsbl requires, and `strictcode analyze` reports no error finding for the repository."

[[option]]
name = "strictspec-generated-format"
subject = "code"
values = "error > warn > off"
default = "error"
scope = "none"
requires = []
description = "Every validator strictspec.toml declares carries a GENERATED_CODE_FORMAT the linked strictspec runtime reads."

[[option]]
name = "target-matrix-fresh"
subject = "project"
values = "error > warn > off"
default = "error"
scope = "none"
requires = []
description = "The committed support matrix matches a fresh regeneration from rlsbl's registries."

[[option]]
name = "target-version-readable"
subject = "project"
values = "error > warn > off"
default = "error"
scope = "none"
requires = []
description = "Every detected target reads its version without error."

[[option]]
name = "test-sandbox"
subject = "tests"
values = "on > off"
default = "off"
scope = "path"
requires = []
description = "Whether the repository distributes the sandboxed test runner .strictmetadata/test-runner/test-runner.toml describes: scaffold renders the runner, and testisolation-floor requires every CI workflow the file names to invoke it."

[[option]]
name = "test-suite"
subject = "tests"
values = "error > warn > off"
default = "error"
scope = "none"
requires = ["prepush-changelog-coverage"]
description = "The project's test suite passes."

[[option]]
name = "test-suite-workspace"
subject = "tests"
values = "error > warn > off"
default = "error"
scope = "none"
requires = ["prepush-changelog-coverage"]
description = "The test suites of the affected workspace members pass."

[[option]]
name = "testisolation-floor"
subject = "tests"
values = "error > warn > off"
default = "error"
scope = "none"
requires = ["declarations-valid"]
description = "An adopted testisolation floor has a working sandbox runner that every CI workflow test-runner.toml names invokes."

[[option]]
name = "unpublished-refs"
subject = "release"
values = "error > warn > off"
default = "error"
scope = "none"
requires = ["version-consistency"]
description = "Every archived release's refs exist locally and on origin at its release commit, and its primary tag carries a GitHub Release (requires network)."

[[option]]
name = "unversioned-boundary"
subject = "workspace"
values = "error > warn > off"
default = "error"
scope = "none"
requires = []
description = "No releasable member has a runtime dependency on an unversioned member."

[[option]]
name = "upload-private-paths"
subject = "project"
values = "error > warn > off"
default = "error"
scope = "none"
requires = []
description = "No npm package or Go module zip carries a private path."

[[option]]
name = "version-consistency"
subject = "project"
values = "error > warn > off"
default = "error"
scope = "none"
requires = []
description = "Every detected target reports the same project version."

[[option]]
name = "workspace-ci-router"
subject = "workspace"
values = "error > warn > off"
default = "error"
scope = "none"
requires = []
description = "The generated ci-router.yml exists at the workspace root."

[[option]]
name = "workspace-ci-synced"
subject = "workspace"
values = "error > warn > off"
default = "error"
scope = "none"
requires = ["workspace-ci-router"]
description = "Each in-scope member's CI jobs are inlined into the shared ci-router.yml."

[[option]]
name = "workspace-stale-entries"
subject = "workspace"
values = "error > warn > off"
default = "error"
scope = "none"
requires = []
description = "No releasables.toml member points to a missing or manifest-less directory."

[[option]]
name = "workspace-targets"
subject = "workspace"
values = "error > warn > off"
default = "error"
scope = "none"
requires = []
description = "Every releasable, non-dev-only workspace member has at least one detectable target."

[[option]]
name = "workspace-unbuildable"
subject = "workspace"
values = "error > warn > off"
default = "error"
scope = "none"
requires = []
description = "Every workspace member syncs under uv sync --all-packages (pypi workspaces)."

[[option]]
name = "workspace-unregistered"
subject = "workspace"
values = "error > warn > off"
default = "error"
scope = "none"
requires = []
description = "No project directory with a manifest is missing from releasables.toml."
