# strictspec manifest for rlsbl. Generation is file-driven: declare each schema
# and its targets, then run `strictspec gen`. Each target's output path names
# where its generated validator lands (committed, read-only 0444); a Go
# validator gets a package of its own, because the generator emits the same
# package-level identifiers for every schema. `strictspec check` verifies
# schema authoring validity and generated-code freshness.
format_version = 1

[[schemas]]
path = ".strictspec/release-file.schema.toml"

  [[schemas.targets]]
  lang    = "go"
  output  = "internal/releaserecord/releasefilespec/rlsbl_release_file_gen.go"
  package = "releasefilespec"

[[schemas]]
path = ".strictspec/transition-record-event.schema.toml"

  [[schemas.targets]]
  lang    = "go"
  output  = "internal/releaserecord/transitionspec/rlsbl_transition_record_event_gen.go"
  package = "transitionspec"

[[schemas]]
path = ".strictspec/reconcile-plan.schema.toml"

  [[schemas.targets]]
  lang    = "go"
  output  = "internal/historyrewrite/reconcileplanspec/rlsbl_reconcile_plan_gen.go"
  package = "reconcileplanspec"

[[schemas]]
path = ".strictspec/releasables.schema.toml"

  [[schemas.targets]]
  lang    = "go"
  output  = "internal/declarations/releasablesspec/rlsbl_releasables_gen.go"
  package = "releasablesspec"

[[schemas]]
path = ".strictspec/test-runner.schema.toml"

  [[schemas.targets]]
  lang    = "go"
  output  = "internal/declarations/testrunnerspec/rlsbl_test_runner_gen.go"
  package = "testrunnerspec"

[[schemas]]
path = ".strictspec/changelog-entry.schema.toml"

  [[schemas.targets]]
  lang    = "go"
  output  = "internal/changelog/entryspec/rlsbl_changelog_entry_gen.go"
  package = "entryspec"
