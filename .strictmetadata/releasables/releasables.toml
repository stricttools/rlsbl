format_version = 1
repository_layout = "standalone"
release_branches = ["main", "master"]
environment_file = "~/Projects/.env"

[timeouts]
push_seconds = 120

[[releasables]]
name = "rlsbl"
tag_format = "v{version}"
publish_mode = "ci"

[[members]]
path = "."
name = "root"
description = "Release orchestration and project scaffolding CLI that bumps versions, validates a structured JSONL changelog, tags only the commit CI verified, and publishes to npm, PyPI, Go and more"
releasable = "rlsbl"
internal_dep_floors = ["strictcli", "strictspec"]
targets = [{ name = "go" }, { name = "npm" }, { name = "pypi" }]

[[members.pipelines]]
name = "go"
type = "go"
target = "go"
local = false
artifact = "binary"
install_paths = ["./cmd/rlsbl"]

[[members.pipelines]]
name = "npm"
type = "npm"
target = "npm"
local = false
artifact = "go-binary"
binary_pipeline = "go"

[[members.pipelines]]
name = "pypi"
type = "pypi"
target = "pypi"
local = false
artifact = "go-binary"
binary_pipeline = "go"
