# strictspec document version gate (do not remove)
format_version = 2
# Version bump type: patch, minor, major, hotfix, or prerelease
bump = "minor"
# Short description of this release (required)
description = "Versioned JSONL merge during migrate-releasable, packages prefix in CHANGELOG rendering, absorb changelog routing fix"
# Optional context explaining why these changes were made
context = "migrate-releasable previously orphaned versioned changelog files, leaving only unreleased.jsonl in the releasable directory. This release adds full changelog consolidation: versioned JSONL files and release metadata are merged during migration. CHANGELOG rendering for releasable members now includes the package name prefix for clarity in multi-package projects."
# Pre-release identifier: alpha, beta, rc, or stable
# preid = ""
# Set to true to generate a blog post for this release
# blog = false
include = ["npm", "pypi"]
exclude = []
release_commit = "12d8dd1365c9e0e9427e13bb9afd1312c286227f"
[released_trees]
"." = "0d7807dfe3678d3b18f70cc0723390d24aa10946"
