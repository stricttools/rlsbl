# strictspec document version gate (do not remove)
format_version = 2
# Version bump type: patch, minor, major, or hotfix
bump = "minor"
# Short description of this release (required)
description = "AST-based __version__ bumping, dunder-version-missing check, and releasable test runner fix"
# Optional context explaining why these changes were made
context = """
The __version__ bumping system was rewritten from regex to AST parsing, eliminating an entire class of
missed version bumps (typed annotations, pre-release strings). A new dunder-version-missing check
catches the pgdesign bug class where a version constant exists under the wrong name.
detect_python_package_root gained uv build-backend and src/ layout support.
The releasable test runner now dispatches the correct test command per member target type.
"""
# Set to true to generate a blog post for this release
# blog = false
include = ["npm", "pypi"]
exclude = []
release_commit = "39143c3d400c5503901acb2c53a3099d91c85fe6"
[released_trees]
"." = "fe54d8a02f1680a9b45a112dccd3785e78c69b91"
