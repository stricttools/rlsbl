# strictspec document version gate (do not remove)
format_version = 2
# Version bump type: patch, minor, or major
bump = "patch"
# Short description of this release (required)
description = "Fix first release on empty remote"
# Optional context explaining why these changes were made
context = "When a project had a configured remote but no commits had been pushed yet, the remote-ahead check would abort because origin/{branch} did not exist. The check now detects this and skips gracefully."
# Set to true to generate a blog post for this release
# blog = false
include = ["npm", "pypi"]
exclude = []
release_commit = "1e690ae47892dda0ef1ff7c70286636f2fb49692"
[released_trees]
"." = "5ec674b87a34b3360a066d927901fb83f532b724"
