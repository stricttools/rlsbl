# strictspec document version gate (do not remove)
format_version = 2
# Version bump type: patch, minor, or major
bump = "minor"
# Short description of this release (required)
description = "Silent exception audit, release robustness fixes, dev-node batch guard"
# Optional context explaining why these changes were made
context = "Systematic audit replaced silent exception swallowing with explicit warnings or hard errors across all commands. Release undo and create now handle GitHub API failures gracefully. Dev-node projects in batch releases now hard-error instead of silently skipping."
include = ["npm", "pypi"]
exclude = []
release_commit = "119d8a38ac7f81e99d4a036b2835f5670650fb99"
