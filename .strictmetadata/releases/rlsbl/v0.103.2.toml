# strictspec document version gate (do not remove)
format_version = 2
# Version bump type: patch, minor, major, hotfix, or prerelease
bump = "patch"
# Short description of this release (required)
description = "Fix release-edit CHANGELOG.md lookup for explicit-mode releasables and carry the package prefix on amended releasable changelog entries."
# Optional context explaining why these changes were made
context = "GitHub Release notes sync (rlsbl release edit) now works for explicit-mode releasables instead of failing with 'CHANGELOG.md not found', and amended releasable changelog entries now render with their [name] prefix like added entries."
# Pre-release identifier: alpha, beta, rc, or stable
# preid = ""
# Set to true to generate a blog post for this release
# blog = false
include = ["npm", "pypi"]
exclude = []
release_commit = "4d085a75db2671fdffc0881d52df1611084091c9"
