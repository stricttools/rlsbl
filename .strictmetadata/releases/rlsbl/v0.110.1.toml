# strictspec document version gate (do not remove)
format_version = 2
# Version bump type: patch, minor, major, infra, or prerelease
bump = "patch"
# Short description of this release (required)
description = "Portable test sandbox: CI-compatible bwrap flags (fix-forward for the unpublished v0.110.0)"
# Optional context explaining why these changes were made
context = """
v0.110.0 was tagged and GitHub-released but never published to npm/PyPI: the
publish workflow gates on CI, and CI was red because scripts/test.sh used the
bubblewrap overlayfs options (--overlay-src/--tmp-overlay), which the stock apt
bubblewrap on the CI runner is built without. This patch replaces the overlay
with universally-supported bwrap flags (read-only download-cache + file://
GOPROXY with a tmpfs GOMODCACHE for Go; a copy-on-write reflink clone of the uv
cache), turning CI green so this release cycle ships to the registries.
"""
# Pre-release identifier: alpha, beta, rc, or stable
# preid = ""
# Set to true to generate a blog post for this release
# blog = false
include = ["npm", "pypi"]
exclude = []
release_commit = "c2d3e538b123934cd01df934b0c78e6b2943290a"
release_notices = [
    "> **Deprecated:** tagged but never published to any registry; the publish failed and was fixed forward. Use v0.111.0 instead.",
]
[released_trees]
"." = "70f0b1eea858d9fcec523b2f556a45211f4c04b1"
